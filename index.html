<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Bellmire — Orlaithe Miniature</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1014;color:#eee;font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans JP",sans-serif}#app{width:100%;height:100%}canvas{display:block}.ui{position:fixed;z-index:10;left:16px;top:16px;max-width:min(680px,calc(100vw - 32px));background:#111923d9;border:1px solid #ffffff20;border-radius:16px;padding:12px 14px;backdrop-filter:blur(12px);box-shadow:0 12px 40px #0007}.title{font-family:Georgia,serif;letter-spacing:.08em;font-size:18px}.sub{font-size:12px;opacity:.72;margin-top:3px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}button{border:1px solid #ffffff25;background:#ffffff0d;color:#eee;border-radius:999px;padding:7px 11px;cursor:pointer}button:hover,button.active{background:#ffffff24}.hint{position:fixed;right:14px;bottom:12px;background:#111923c9;border:1px solid #ffffff18;border-radius:12px;padding:8px 10px;font-size:11px;opacity:.82}.badge{font-size:11px;opacity:.7;margin-left:6px}.resident{position:fixed;z-index:10;right:16px;top:16px;background:#111923d9;border:1px solid #ffffff20;border-radius:14px;padding:10px;backdrop-filter:blur(12px)}select{background:#101821;color:#eee;border:1px solid #ffffff25;border-radius:9px;padding:6px}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b1014;z-index:30;font-family:Georgia,serif;letter-spacing:.1em}.loading.hide{display:none}@media(max-width:700px){.ui{left:8px;top:8px;right:8px;max-width:none;padding:10px}.resident{right:8px;top:auto;bottom:8px;padding:7px}.hint{display:none}.title{font-size:15px}.sub{font-size:10px}.row{gap:5px;margin-top:6px}button{padding:7px 9px;font-size:12px}select{font-size:12px;max-width:130px}}#error{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#101820;color:#fff;padding:28px;text-align:center;font-family:system-ui}#error.show{display:grid}#error div{max-width:560px;line-height:1.7}
</style></head><body><div id='app'></div><div class='loading' id='loading'>B E L L M I R E</div>
<div id='error'><div><h2>Bellmireを読み込めませんでした</h2><p>Safariでページを再読み込みしてください。GitHub Pagesから開いている場合は、通信環境を確認してもう一度お試しください。</p></div></div><div class='ui'><div class='title'>BELLMIRE <span class='badge'>Orlaithe miniature</span></div><div class='sub'>段丘都市ベルマイア — 水路・石段・鐘楼・暮らしのある箱庭</div>
<div class='row' id='weather'><button data-w='clear' class='active'>晴れ</button><button data-w='rain'>雨</button><button data-w='fog'>霧</button><button data-w='blackout'>停電</button><button data-w='dawn'>夜明け</button><button data-w='night'>夜</button></div>
<div class='row' id='views'><button data-v='overview' class='active'>全景</button><button data-v='alley'>路地</button><button data-v='bakery'>パン屋</button><button data-v='rooftop'>屋上</button><button data-v='belfry'>鐘楼</button><button data-v='drone'>ドローン</button><button data-v='train'>列車</button></div>
<div class='row'><button id='follow'>住人を追う</button><button id='fullscreen'>全画面</button></div></div>
<div class='resident'>追跡する住人 <select id='residentSel'><option value='0'>パン屋</option><option value='1'>本屋</option><option value='2'>旅人</option><option value='3'>吟遊詩人</option></select></div><div class='hint'>ドラッグ: 視点回転　ホイール: ズーム　右ドラッグ: 平行移動</div>
<script>window.addEventListener('error',e=>{const l=document.querySelector('#loading');if(l)l.classList.add('hide');const box=document.querySelector('#error');if(box){box.classList.add('show');box.querySelector('p').textContent='読み込みエラー: '+(e.message||'不明なエラー')+'。ページを再読み込みしてください。';}});window.addEventListener('unhandledrejection',e=>{const l=document.querySelector('#loading');if(l)l.classList.add('hide');const box=document.querySelector('#error');if(box){box.classList.add('show');box.querySelector('p').textContent='読み込みエラー: '+(e.reason?.message||e.reason||'不明なエラー');}});setTimeout(()=>{const l=document.querySelector('#loading');if(l&&!l.classList.contains('hide')){l.innerHTML='BELLMIRE<br><small style="font-family:system-ui;letter-spacing:0;font-size:12px;opacity:.7">読み込みに時間がかかっています…</small>'}},7000)</script><script type='importmap'>
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type='module'>
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const app=document.querySelector('#app'), scene=new THREE.Scene();scene.background=new THREE.Color(0x9fb1a7);scene.fog=new THREE.FogExp2(0x9fb1a7,.007);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,500);camera.position.set(65,58,76);
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(err){document.querySelector('#loading').classList.add('hide');document.querySelector('#error').classList.add('show');throw err;}renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;app.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,8,0);controls.maxPolarAngle=Math.PI*.48;controls.enablePan=true;controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.35,.7,.82);composer.addPass(bloom);
const hemi=new THREE.HemisphereLight(0xd8e7df,0x423b31,1.5);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff0cf,2.4);sun.position.set(-45,75,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.85,m=.05)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const stone=mat(0x8a8273), darkStone=mat(0x5f5d55), roof=mat(0x3f4c43), wood=mat(0x5a3e2d), plaster=mat(0xb7ad94), water=mat(0x466f77,.25,.1), grass=mat(0x65775a), pathMat=mat(0x8d8678);
function box(x,y,z,w,h,d,ma=stone){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);o.position.set(x,y+h/2,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function roofObj(x,y,z,w,d,h=2.4){const g=new THREE.ConeGeometry(Math.max(w,d)*.72,h,4);const o=new THREE.Mesh(g,roof);o.rotation.y=Math.PI/4;o.position.set(x,y+h/2,z);o.castShadow=true;scene.add(o);return o}
function house(x,z,y,s=1,kind=0){const w=(5+Math.random()*3)*s,d=(4+Math.random()*3)*s,h=(5+Math.random()*4)*s;const b=box(x,y,z,w,h,d,kind%3===0?plaster:stone);roofObj(x,y+h,z,w,d,2.3*s);if(Math.random()>.25){const winMat=new THREE.MeshStandardMaterial({color:0xffc46b,emissive:0xff9d35,emissiveIntensity:.5});for(const sx of [-1,1]){const q=new THREE.Mesh(new THREE.BoxGeometry(.65*s,.85*s,.12),winMat);q.position.set(x+sx*w*.23,y+h*.55,z+d/2+.07);scene.add(q)}}return b}
// terrain terraces
box(0,-2,0,120,3,92,grass);box(-2,1,-8,92,4,60,darkStone);box(-5,5,-16,72,5,44,stone);box(-8,10,-23,54,5,31,darkStone);
// canal
const canal=box(22,.05,12,10,.35,76,water);for(let z=-24;z<45;z+=16){box(22,.5,z,15,.8,3,pathMat)}
// lower/middle/upper houses
for(let i=0;i<25;i++){let x=-43+Math.random()*52,z=9+Math.random()*31;house(x,z,1.1,0.75+Math.random()*.25,i)}
for(let i=0;i<27;i++){let x=-37+Math.random()*58,z=-13+Math.random()*22;house(x,z,5.2,0.72+Math.random()*.25,i)}
for(let i=0;i<18;i++){let x=-29+Math.random()*44,z=-31+Math.random()*16;house(x,z,10.2,0.78+Math.random()*.22,i)}
// stair spine
for(let i=0;i<22;i++){box(-1,1+i*.48,18-i*2.05,5,.45,2,pathMat)}
// belfry
box(-9,15,-31,9,20,9,darkStone);roofObj(-9,35,-31,10,10,5);const bell=new THREE.Mesh(new THREE.CylinderGeometry(1.5,2.1,2.3,18),mat(0x7c5b2c,.35,.7));bell.position.set(-9,29,-26.3);bell.rotation.x=Math.PI/2;scene.add(bell);
// bakery and oven smoke
const bakery=house(-30,24,1.1,1.15,2);const chimney=box(-32.5,8.8,23,1.3,5,1.3,darkStone);
// waterwheel
const wheel=new THREE.Group();const rim=new THREE.Mesh(new THREE.TorusGeometry(4,.35,10,28),wood);rim.rotation.y=Math.PI/2;wheel.add(rim);for(let i=0;i<10;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.22,7.4,.3),wood);s.rotation.z=i*Math.PI/10;wheel.add(s)}wheel.position.set(17,5,26);scene.add(wheel);
// rail along far lower edge
for(let z=-42;z<45;z+=3){box(45,.4,z,.3,.3,2.4,darkStone);box(49,.4,z,.3,.3,2.4,darkStone)}
const train=new THREE.Group();for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.BoxGeometry(3.4,3.3,8),mat(0x596b60));c.position.z=i*8.5;train.add(c)}train.position.set(47,2,-35);scene.add(train);
// residents
const residents=[];function person(color=0x6c4735){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.35,4,8),mat(color));body.position.y=1.25;const head=new THREE.Mesh(new THREE.SphereGeometry(.42,12,8),mat(0xcaa27e));head.position.y=2.35;g.add(body,head);scene.add(g);residents.push(g);return g}const p0=person(0x8a5b3e),p1=person(0x526a58),p2=person(0x7b6a55),bard=person(0x244d39);bard.scale.set(.9,1.08,.9);
const routes=[{p:p0,a:new THREE.Vector3(-34,1.2,25),b:new THREE.Vector3(-18,1.2,18),s:.055},{p:p1,a:new THREE.Vector3(-13,5.4,-2),b:new THREE.Vector3(8,5.4,-7),s:.042},{p:p2,a:new THREE.Vector3(6,5.4,9),b:new THREE.Vector3(18,5.4,4),s:.05},{p:bard,a:new THREE.Vector3(-5,10.5,-18),b:new THREE.Vector3(-21,10.5,-25),s:.032}];
// smoke particles
const smoke=[];for(let i=0;i<26;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.35+Math.random()*.45,8,6),new THREE.MeshBasicMaterial({color:0xbfc4bd,transparent:true,opacity:.18}));scene.add(m);smoke.push(m)}
// rain
const rainN=2200,rainPos=new Float32Array(rainN*3);for(let i=0;i<rainN;i++){rainPos[i*3]=(Math.random()-.5)*130;rainPos[i*3+1]=Math.random()*75;rainPos[i*3+2]=(Math.random()-.5)*100}const rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xb9d2e1,size:.12,transparent:true,opacity:.65}));rain.visible=false;scene.add(rain);
let weather='clear',view='overview',follow=false,followIdx=0,clock=new THREE.Clock();
const views={overview:[[65,58,76],[0,8,0]],alley:[[-12,9,22],[-8,6,2]],bakery:[[-41,8,34],[-29,5,23]],rooftop:[[4,24,5],[-8,9,-14]],belfry:[[-4,28,-18],[-9,25,-31]],drone:[[0,35,45],[0,8,-5]],train:[[53,7,-28],[10,7,-15]]};
function setView(v){view=v;follow=false;document.querySelector('#follow').classList.remove('active');const [p,t]=views[v];camera.position.fromArray(p);controls.target.fromArray(t);controls.enabled=v!=='train'&&v!=='drone';document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}
function setWeather(w){weather=w;rain.visible=w==='rain';bloom.strength=(w==='night'||w==='fog'||w==='blackout')?.7:.35;if(w==='night'){scene.background.set(0x07111d);scene.fog.color.set(0x13202b);scene.fog.density=.012;hemi.intensity=.35;sun.intensity=.08;renderer.toneMappingExposure=.72}else if(w==='dawn'){scene.background.set(0x788aa1);scene.fog.color.set(0x9a9aa0);scene.fog.density=.009;hemi.intensity=.9;sun.color.set(0xffb56d);sun.intensity=1.15;renderer.toneMappingExposure=.9}else if(w==='fog'){scene.background.set(0x9ba39d);scene.fog.color.set(0xaeb4ae);scene.fog.density=.025;hemi.intensity=1.05;sun.intensity=.7;renderer.toneMappingExposure=.9}else if(w==='blackout'){scene.background.set(0x0a1118);scene.fog.color.set(0x111a20);scene.fog.density=.014;hemi.intensity=.18;sun.intensity=.03;renderer.toneMappingExposure=.55;scene.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissiveIntensity=0})}else{scene.background.set(w==='rain'?0x66747a:0x9fb1a7);scene.fog.color.set(w==='rain'?0x718087:0x9fb1a7);scene.fog.density=w==='rain'?.012:.007;hemi.intensity=w==='rain'?.8:1.5;sun.intensity=w==='rain'?.45:2.4;sun.color.set(0xfff0cf);renderer.toneMappingExposure=w==='rain'?.82:1;scene.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissiveIntensity=.5})}document.querySelectorAll('#weather button').forEach(b=>b.classList.toggle('active',b.dataset.w===w))}
document.querySelector('#weather').onclick=e=>e.target.dataset.w&&setWeather(e.target.dataset.w);document.querySelector('#views').onclick=e=>e.target.dataset.v&&setView(e.target.dataset.v);document.querySelector('#residentSel').onchange=e=>followIdx=+e.target.value;document.querySelector('#follow').onclick=e=>{follow=!follow;e.target.classList.toggle('active',follow);controls.enabled=!follow};document.querySelector('#fullscreen').onclick=()=>{const el=document.documentElement;if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();};
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();wheel.rotation.x=t*.32;train.position.z=((t*4+10)%95)-48;for(let i=0;i<routes.length;i++){const r=routes[i],u=(Math.sin(t*r.s*8+i)+1)/2;r.p.position.lerpVectors(r.a,r.b,u);r.p.lookAt(u<.5?r.b:r.a)}for(let i=0;i<smoke.length;i++){const q=smoke[i],u=(t*.12+i/smoke.length)%1;q.position.set(-32.5+Math.sin(t+i)*.5,14+u*15,23+Math.cos(t*.7+i)*.45);q.scale.setScalar(.6+u*2.2);q.material.opacity=.2*(1-u)}if(rain.visible){const a=rain.geometry.attributes.position.array;for(let i=0;i<rainN;i++){a[i*3+1]-=.55;if(a[i*3+1]<0)a[i*3+1]=70}rain.geometry.attributes.position.needsUpdate=true}if(view==='drone'&&!follow){camera.position.set(Math.sin(t*.08)*55,30+Math.sin(t*.13)*5,Math.cos(t*.08)*55);camera.lookAt(0,7,-5)}if(view==='train'&&!follow){camera.position.set(53,6.3,train.position.z+8);camera.lookAt(5,8,train.position.z-5)}if(follow){const p=residents[followIdx],dir=new THREE.Vector3();p.getWorldDirection(dir);const desired=p.position.clone().add(new THREE.Vector3(0,3.2,0)).add(dir.clone().multiplyScalar(-5));camera.position.lerp(desired,.08);const target=p.position.clone().add(new THREE.Vector3(0,1.6,0));camera.lookAt(target)}controls.update();composer.render()}
setView('overview');setWeather('clear');animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});document.querySelector('#loading').classList.add('hide');
</script></body></html>
