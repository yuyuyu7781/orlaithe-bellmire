<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bellmire v4 — Orlaithe miniature</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1115;color:#eee;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}canvas{display:block}
.panel{position:fixed;z-index:20;left:14px;top:14px;width:min(650px,calc(100vw - 28px));padding:13px 15px;background:#101923dd;border:1px solid #ffffff20;border-radius:17px;backdrop-filter:blur(14px);box-shadow:0 12px 38px #0007;transition:.25s}.head{display:flex;align-items:center;gap:10px}.title{font:20px Georgia,serif;letter-spacing:.12em}.badge{font:11px Georgia,serif;opacity:.62}.sub{font-size:11px;opacity:.68;margin-top:3px}.rows{overflow:hidden;max-height:220px;transition:.25s}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
button,select{border:1px solid #ffffff24;background:#ffffff0d;color:#eee;border-radius:999px;padding:7px 11px;font-size:12px}button{cursor:pointer}button:hover,button.active{background:#d8c8a526;color:#fff;border-color:#e5d5b850}.toggle{display:none;margin-left:auto}
.resident{position:fixed;z-index:20;right:14px;top:14px;padding:9px 11px;background:#101923dd;border:1px solid #ffffff20;border-radius:14px;backdrop-filter:blur(12px);font-size:12px}.hint{position:fixed;z-index:10;right:12px;bottom:10px;background:#101923c9;border:1px solid #ffffff18;border-radius:10px;padding:7px 9px;font-size:10px;opacity:.75}
.loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#0b1115;font:20px Georgia,serif;letter-spacing:.22em}.loading.hide{display:none}#error{display:none;position:fixed;inset:0;z-index:50;place-items:center;background:#101820;padding:30px;text-align:center}#error.show{display:grid}
@media(max-width:700px){.panel{left:8px;top:8px;width:auto;right:8px;padding:10px 12px}.title{font-size:16px}.badge,.sub{font-size:9px}.toggle{display:block}.panel.collapsed{right:auto;width:auto}.panel.collapsed .badge,.panel.collapsed .sub,.panel.collapsed .rows{display:none}.panel.collapsed .title{font-size:14px}.panel.collapsed .toggle{margin-left:8px}.row{gap:5px;margin-top:7px}button,select{padding:7px 9px;font-size:11px}.resident{right:8px;top:auto;bottom:8px;padding:7px 9px}.hint{display:none}}
</style></head>
<body>
<div id="app"></div><div id="loading" class="loading">B E L L M I R E</div>
<div id="error"><div><h2>Bellmireを読み込めませんでした</h2><p>ページを再読み込みしてください。</p></div></div>
<div id="panel" class="panel"><div class="head"><div><div class="title">BELLMIRE <span class="badge">Orlaithe miniature · v4</span></div><div class="sub">Lower Bellmire — 石段、水路、The First Loaf、夜明け前の暮らし</div></div><button id="toggle" class="toggle">街を見る</button></div><div class="rows">
<div class="row" id="weather"><button data-w="clear">晴れ</button><button data-w="rain">雨</button><button data-w="fog">霧</button><button data-w="blackout">停電</button><button data-w="dawn" class="active">夜明け</button><button data-w="night">夜</button></div>
<div class="row" id="views"><button data-v="overview" class="active">全景</button><button data-v="alley">路地</button><button data-v="bakery">パン屋</button><button data-v="canal">水路</button><button data-v="rooftop">屋上</button><button data-v="belfry">鐘楼</button><button data-v="drone">ドローン</button><button data-v="train">列車</button></div>
<div class="row"><button id="follow">住人を追う</button><button id="fullscreen">全画面</button></div></div></div>
<div class="resident">追跡 <select id="residentSel"><option value="0">パン屋</option><option value="1">本屋</option><option value="2">旅人</option><option value="3">吟遊詩人</option></select></div>
<div class="hint">ドラッグ：回転　ホイール：ズーム　右ドラッグ：移動</div>
<script>addEventListener('error',e=>{loading.classList.add('hide');error.classList.add('show');error.querySelector('p').textContent='読み込みエラー: '+(e.message||'不明なエラー')});</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x89988f);scene.fog=new THREE.FogExp2(0x89988f,.009);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.getElementById('app').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.28,.75,.78);composer.addPass(bloom);
const hemi=new THREE.HemisphereLight(0xc8d5cf,0x332d28,1.15);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffe2b5,1.65);sun.position.set(-45,65,35);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const M=(c,r=.85,m=.02)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}),stone=M(0x77756b),stone2=M(0x5d625c),plaster=M(0xa9a28d),roof=M(0x3d4b43),wood=M(0x59402f),path=M(0x8d8778),grass=M(0x596b53),water=M(0x3f6d73,.25,.08),metal=M(0x4c4a43,.45,.5);const lit=[];
function box(x,y,z,w,h,d,ma=stone,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);o.position.set(x,y+h/2,z);o.castShadow=o.receiveShadow=true;parent.add(o);return o}
function roofAt(x,y,z,w,d,h=2,parent=scene){const o=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,h,4),roof);o.rotation.y=Math.PI/4;o.position.set(x,y+h/2,z);o.castShadow=true;parent.add(o)}
function windowAt(x,y,z,s=.55){const ma=new THREE.MeshStandardMaterial({color:0xf3c17a,emissive:0xff9f43,emissiveIntensity:.65});const o=new THREE.Mesh(new THREE.BoxGeometry(s,s*1.35,.1),ma);o.position.set(x,y,z);scene.add(o);lit.push(ma)}
function house(x,z,y,w=5.5,d=4.8,h=6,kind=0){box(x,y,z,w,h,d,kind%3?stone:plaster);roofAt(x,y+h,z,w,d,2);windowAt(x-w*.22,y+h*.55,z+d/2+.06);windowAt(x+w*.22,y+h*.55,z+d/2+.06);if(kind%4===0)box(x+w*.3,y+h,z-.3,.7,2.6,.7,stone2)}
box(0,-2,0,112,3,90,grass);box(-9,1,-5,88,3.4,64,stone2);box(-13,4.4,-15,69,3.7,43,stone);box(-15,8.1,-24,49,4,26,stone2);
box(20,.05,10,8,.38,76,water);box(14,.2,10,3,.55,76,path);box(26,.2,10,3,.55,76,path);[-25,-7,12,31].forEach(z=>box(20,.55,z,15,.65,2.5,path));
const lower=[[-43,31,6,5],[-36,32,5,5],[-29,32,6,4.5],[-21,31,5,5],[-42,23,5,5],[-34,24,6,4.5],[-25,24,5,5],[-17,23,6,5],[-44,15,6,5],[-36,16,5,4.5],[-28,15,6,5],[-19,15,5,4.5],[-11,16,5,5],[-43,8,5,4.5],[-34,8,6,5],[-25,8,5,4.5],[-16,8,6,5],[-8,8,5,5]];
lower.forEach((a,i)=>house(a[0]+(i%3)*.35,a[1],1.1,a[2],a[3],5.5+(i%4)*.7,i));
const mid=[[-39,-4],[-31,-5],[-23,-4],[-14,-5],[-5,-4],[5,-5],[-37,-12],[-28,-13],[-19,-12],[-10,-13],[0,-12],[9,-13]];mid.forEach((a,i)=>house(a[0],a[1],4.5,5.5+(i%2),4.5,6+(i%3),i));
const upper=[[-34,-23],[-25,-24],[-16,-23],[-7,-24],[2,-23],[-29,-31],[-19,-32],[-9,-31]];upper.forEach((a,i)=>house(a[0],a[1],8.2,6,5,7+(i%2),i));
for(let i=0;i<25;i++){const x=-4+Math.sin(i*.55)*2.2,z=23-i*2.05,y=1.1+i*.31;box(x,y,z,4.1,.35,1.8,path)}
// The First Loaf
box(-31,1.1,24,8,7,6,plaster);roofAt(-31,8.1,24,8,6,2.5);box(-31,1.12,27.08,3.1,3.4,.18,wood);windowAt(-34,4.7,27.1,1.15);windowAt(-28,4.7,27.1,1.15);box(-34.2,8,23,1,4.5,1,stone2);box(-31,5.6,27.25,4,.9,.16,wood);const ovenGlow=new THREE.PointLight(0xffa34e,2.2,16);ovenGlow.position.set(-31,4,26);scene.add(ovenGlow);
function barrel(x,z,y=1.1){const o=new THREE.Mesh(new THREE.CylinderGeometry(.55,.62,1.2,10),wood);o.position.set(x,y+.6,z);scene.add(o)}
[[-37,27],[-26,27],[-18,19],[-40,12],[-12,11]].forEach(p=>barrel(...p));[[-38,19],[-23,19],[-14,27],[-30,11]].forEach(p=>{box(p[0],1.1,p[1],1.2,1,1.2,wood);box(p[0]+1,1.1,p[1]+.4,.8,.7,.8,wood)});
const cloth=[0xb46f5e,0xd1c4a5,0x697c74,0x8d6c75];for(let k=0;k<4;k++){const ma=M(cloth[k],.95);for(let i=0;i<3;i++)box(-40+k*9+i*1.3,7.5-k*.35,20-k*2,1,.08,1.4,ma)}
box(-13,12.1,-32,9,19,9,stone2);roofAt(-13,31.1,-32,10,10,5);const bell=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.9,2.2,18),M(0x76572d,.4,.65));bell.position.set(-13,26,-27.4);bell.rotation.x=Math.PI/2;scene.add(bell);
const wheel=new THREE.Group(),rim=new THREE.Mesh(new THREE.TorusGeometry(3.7,.3,8,28),wood);rim.rotation.y=Math.PI/2;wheel.add(rim);for(let i=0;i<12;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.18,6.8,.25),wood);s.rotation.z=i*Math.PI/12;wheel.add(s)}wheel.position.set(16,4.6,27);scene.add(wheel);
for(let z=-42;z<44;z+=3){box(44,.35,z,.25,.25,2.4,metal);box(48,.35,z,.25,.25,2.4,metal)}
const train=new THREE.Group();for(let i=0;i<3;i++){const c=box(0,0,i*8,3.2,3.2,7.5,M(0x53675e),train);c.position.y=1.6}train.position.set(46,1,-35);scene.add(train);
const residents=[];function person(c){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,1.15,4,8),M(c)),head=new THREE.Mesh(new THREE.SphereGeometry(.36,10,8),M(0xb98e6d));body.position.y=1.1;head.position.y=2.05;g.add(body,head);scene.add(g);residents.push(g);return g}
const p0=person(0x7e4d35),p1=person(0x53695c),p2=person(0x6c6257),bard=person(0x2d5144);
const routes=[{p:p0,a:new THREE.Vector3(-35,1.15,28),b:new THREE.Vector3(-22,1.15,26),s:.38},{p:p1,a:new THREE.Vector3(-39,1.15,12),b:new THREE.Vector3(-24,1.15,12),s:.3},{p:p2,a:new THREE.Vector3(-12,4.6,-8),b:new THREE.Vector3(7,4.6,-8),s:.34},{p:bard,a:new THREE.Vector3(12,1.15,19),b:new THREE.Vector3(12,1.15,24),s:.12}];
const smoke=[];for(let i=0;i<34;i++){const q=new THREE.Mesh(new THREE.SphereGeometry(.25+Math.random()*.35,7,5),new THREE.MeshBasicMaterial({color:0xc4c4b8,transparent:true,opacity:.12}));scene.add(q);smoke.push(q)}
const N=1500,a=new Float32Array(N*3);for(let i=0;i<N;i++){a[i*3]=(Math.random()-.5)*120;a[i*3+1]=Math.random()*65;a[i*3+2]=(Math.random()-.5)*95}const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(a,3));const rain=new THREE.Points(rg,new THREE.PointsMaterial({color:0xc5d7de,size:.11,transparent:true,opacity:.6}));rain.visible=false;scene.add(rain);
let view='overview',followMode=false,followIdx=0;
const viewMap={overview:[[64,53,73],[-7,7,-2]],alley:[[-39,6,35],[-28,4,20]],bakery:[[-39,7,34],[-31,4,24]],canal:[[31,7,33],[17,3,14]],rooftop:[[-5,21,13],[-20,7,0]],belfry:[[-4,27,-17],[-13,23,-32]],drone:[[0,33,45],[-8,6,-5]],train:[[52,6,-27],[5,7,-10]]};
function setView(v){view=v;followMode=false;document.getElementById('follow').classList.remove('active');const[p,t]=viewMap[v];camera.position.fromArray(p);controls.target.fromArray(t);controls.enabled=!['drone','train'].includes(v);document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}
function setWeather(w){rain.visible=w==='rain';lit.forEach(m=>m.emissiveIntensity=w==='blackout'?0:.65);ovenGlow.intensity=w==='blackout'?0:2.2;const cfg={clear:[0x89988f,.009,1.15,1.65,.9,.28],rain:[0x5d6b70,.014,.7,.38,.78,.35],fog:[0x9ba29b,.028,.9,.5,.82,.55],blackout:[0x071017,.016,.12,.02,.48,.2],dawn:[0x5f6c7d,.014,.48,.42,.68,.42],night:[0x07111d,.014,.25,.05,.58,.72]}[w];scene.background.set(cfg[0]);scene.fog.color.set(cfg[0]);scene.fog.density=cfg[1];hemi.intensity=cfg[2];sun.intensity=cfg[3];renderer.toneMappingExposure=cfg[4];bloom.strength=cfg[5];sun.color.set(w==='dawn'?0xd58b62:0xffe2b5);document.querySelectorAll('#weather button').forEach(b=>b.classList.toggle('active',b.dataset.w===w))}
document.getElementById('weather').onclick=e=>e.target.dataset.w&&setWeather(e.target.dataset.w);document.getElementById('views').onclick=e=>e.target.dataset.v&&setView(e.target.dataset.v);residentSel.onchange=e=>followIdx=+e.target.value;
follow.onclick=()=>{followMode=!followMode;follow.classList.toggle('active',followMode);controls.enabled=!followMode};fullscreen.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();toggle.onclick=()=>{panel.classList.toggle('collapsed');toggle.textContent=panel.classList.contains('collapsed')?'操作':'街を見る'};if(innerWidth<701)panel.classList.add('collapsed');
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();wheel.rotation.x=t*.28;train.position.z=((t*3.2)%95)-48;routes.forEach((r,i)=>{const u=(Math.sin(t*r.s+i)+1)/2;r.p.position.lerpVectors(r.a,r.b,u);r.p.lookAt(u<.5?r.b:r.a)});smoke.forEach((q,i)=>{const u=(t*.09+i/smoke.length)%1;q.position.set(-34.2+Math.sin(t*.4+i)*.45,12+u*14,23+Math.cos(t*.35+i)*.35);q.scale.setScalar(.5+u*2.3);q.material.opacity=.14*(1-u)});if(rain.visible){const p=rg.attributes.position.array;for(let i=0;i<N;i++){p[i*3+1]-=.48;if(p[i*3+1]<0)p[i*3+1]=65}rg.attributes.position.needsUpdate=true}if(view==='drone'&&!followMode){camera.position.set(Math.sin(t*.07)*52,29+Math.sin(t*.11)*4,Math.cos(t*.07)*52);camera.lookAt(-8,6,-4)}if(view==='train'&&!followMode){camera.position.set(52,5.7,train.position.z+7);camera.lookAt(3,6,train.position.z-4)}if(followMode){const p=residents[followIdx],d=new THREE.Vector3();p.getWorldDirection(d);camera.position.lerp(p.position.clone().add(new THREE.Vector3(0,2.8,0)).add(d.multiplyScalar(-4.5)),.07);camera.lookAt(p.position.clone().add(new THREE.Vector3(0,1.4,0)))}controls.update();composer.render()}
setView('overview');setWeather('dawn');animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});loading.classList.add('hide');
</script></body></html>
