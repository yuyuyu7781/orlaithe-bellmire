// Legacy waterfront cleanup is order-sensitive: keep these checkpoints in place.
// Only retire meshes present at each checkpoint; future waterfront additions must
// not be selected by a broad geometry scan after the whole town is constructed.
const retiredWaterfrontMeshes=new Set();
const waterfrontCleanupRules={
  v100:(p,w,h,d,a,b)=>p.z>18 && p.y<4 && a>18 && b<9 && h>1.4,
  v99:(p,w,h,d,a,b)=>a>=20 && b<=13 && h>=2 && p.z>12 && p.y<5,
  v98:(p,w,h,d,a,b)=>a>=18 && b<=12 && h>=2 && p.z>18 && p.y<5,
  v97:(p,w,h,d)=>w>=18 && h>=2 && d<=6 && p.z>24 && p.y<5,
  v101:(p,w,h,d,a,b)=>p.z>24 && p.y<4.2 && a>14 && b<12 && h>1.2
};
function retireLegacyWaterfront(rule){
  scene.traverse(o=>{
    if(!o.isMesh || !o.geometry?.parameters || retiredWaterfrontMeshes.has(o)) return;
    const g=o.geometry.parameters,w=g.width||0,h=g.height||0,d=g.depth||0;
    if(rule(o.position,w,h,d,Math.max(w,d),Math.min(w,d))){
      retiredWaterfrontMeshes.add(o);
      o.visible=false;
    }
  });
}
function finalizeWaterfront(){
  // Reassert retirement after later construction, without hiding new piers,
  // homes or stalls. Safe to repeat; do not dispose shared geometry/materials.
  retiredWaterfrontMeshes.forEach(o=>o.visible=false);
}

function landHarborObject(object,surfaceY){
