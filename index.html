for(const [x,z,y] of [[-45,4,1.1],[-29,-18,4.5],[-4,-29,6.3]]){box(x,y,z,2.2,2.8,1.5,stone2);roofAt(x,y+2.8,z,2.2,1.5,.9);const l=new THREE.PointLight(0xffc36c,.55,5);l.position.set(x,y+1.8,z+1);scene.add(l)}

box(-13,12.1,-32,9,19,9,stone2);roofAt(-13,31.1,-32,10,10,5);const bell=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.9,2.2,18),M(0x76572d,.4,.65));bell.position.set(-13,26,-27.4);bell.rotation.x=Math.PI/2;scene.add(bell);
const wheel=new THREE.Group();
const rim=new THREE.Mesh(new THREE.TorusGeometry(3.7,.3,8,32),wood);wheel.add(rim);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.5,14),metal);hub.rotation.x=Math.PI/2;wheel.add(hub);

  const ang=i*Math.PI/6;
  const spoke=new THREE.Mesh(new THREE.BoxGeometry(.18,6.8,.22),wood);spoke.rotation.z=ang;wheel.add(spoke);

wheel.position.set(21.05,4.55,27);wheel.rotation.y=Math.PI/2;scene.add(wheel);
const axle=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,3.0,12),metal);axle.rotation.z=Math.PI/2;axle.position.set(21.05,4.55,27);scene.add(axle);
for(let z=-42;z<44;z+=3){box(44,.35,z,.25,.25,2.4,metal);box(48,.35,z,.25,.25,2.4,metal)}
const train=new THREE.Group();for(let i=0;i<3;i++){const c=box(0,0,i*8,3.2,3.2,7.5,M(0x53675e),train);c.position.y=1.6}train.position.set(46,1,-35);scene.add(train);
const residents=[];function person(c){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,1.15,4,8),M(c)),head=new THREE.Mesh(new THREE.SphereGeometry(.36,10,8),M(0xb98e6d));body.position.y=1.1;head.position.y=2.05;g.add(body,head);scene.add(g);residents.push(g);return g}
const p0=person(0x7e4d35),p1=person(0x53695c),p2=person(0x6c6257),bard=person(0x2d5144);
const routes=[{p:p0,a:new THREE.Vector3(-35,1.15,28),b:new THREE.Vector3(-22,1.15,26),s:.38},{p:p1,a:new THREE.Vector3(-39,1.15,12),b:new THREE.Vector3(-24,1.15,12),s:.3},{p:p2,a:new THREE.Vector3(-12,4.6,-8),b:new THREE.Vector3(7,4.6,-8),s:.34},{p:bard,a:new THREE.Vector3(12,1.15,19),b:new THREE.Vector3(12,1.15,24),s:.12}];

// v8 readable resident
const residentV8=new THREE.Group();
let rv=new THREE.Mesh(new THREE.CylinderGeometry(.38,.52,1.45,7),v8Coat);rv.position.y=1.65;residentV8.add(rv);
rv=new THREE.Mesh(new THREE.SphereGeometry(.34,10,8),v8Skin);rv.position.y=2.65;residentV8.add(rv);
rv=new THREE.Mesh(new THREE.CylinderGeometry(.42,.48,.18,10),v8Wood);rv.position.y=2.98;residentV8.add(rv);
for(const xx of [-.22,.22]){rv=new THREE.Mesh(new THREE.CylinderGeometry(.09,.11,.9,7),v8Boot);rv.position.set(xx,.55,0);residentV8.add(rv)}
for(const xx of [-.52,.52]){rv=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,1.05,7),v8Coat);rv.position.set(xx,1.7,0);rv.rotation.z=xx<0?-.18:.18;residentV8.add(rv)}
residentV8.position.set(-10,1.1,24);residentV8.scale.setScalar(1.25);scene.add(residentV8);
// v6.1 cat — guaranteed definition before animation starts
const cat=new THREE.Group();
const catMat=M(0x393632,.9);
const catBody=new THREE.Mesh(new THREE.SphereGeometry(.46,12,8),catMat);
catBody.scale.set(1.45,.72,.78);catBody.position.set(0,.62,0);cat.add(catBody);
const catHead=new THREE.Mesh(new THREE.SphereGeometry(.34,12,8),catMat);
catHead.position.set(.58,.82,0);cat.add(catHead);
for(const zz of [-.18,.18]){
  const ear=new THREE.Mesh(new THREE.ConeGeometry(.13,.30,4),catMat);
  ear.position.set(.57,1.10,zz);ear.rotation.y=Math.PI/4;cat.add(ear);
}
for(const zz of [-.22,.22]){
  for(const xx of [-.42,.38]){
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,.55,7),catMat);
    leg.position.set(xx,.28,zz);cat.add(leg);
  }
}
const tail=new THREE.Mesh(new THREE.TorusGeometry(.55,.075,7,18,Math.PI*1.45),catMat);
tail.rotation.y=Math.PI/2;tail.position.set(-.72,.82,0);cat.add(tail);

scene.add(cat);

const chimneySources=[
  [-34.2,12,23],
  [-20,12,29],
  [-39,16,-1],
  [-5,14,-4]
];
const smoke=[];for(let i=0;i<34;i++){const q=new THREE.Mesh(new THREE.SphereGeometry(.25+Math.random()*.35,7,5),new THREE.MeshBasicMaterial({color:0xc4c4b8,transparent:true,opacity:.12}));scene.add(q);smoke.push(q)}
const N=1500,a=new Float32Array(N*3);for(let i=0;i<N;i++){a[i*3]=(Math.random()-.5)*120;a[i*3+1]=Math.random()*65;a[i*3+2]=(Math.random()-.5)*95}const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(a,3));const rain=new THREE.Points(rg,new THREE.PointsMaterial({color:0xc5d7de,size:.11,transparent:true,opacity:.6}));rain.visible=false;scene.add(rain);
let view='overview',followMode=false,followIdx=0;
const viewMap={overview:[[72,54,78],[-2,7,0]],alley:[[-15,6,36],[-9,5,23]],streetwalk:[[-34,4.4,34],[-18,3.5,24]],resident:[[-4,4.3,29],[-9,3.1,24]],catview:[[-25,3.3,16],[-20,2.0,18]],bakery:[[-39,7,34],[-31,4,24]],bookshop:[[-25,7,38],[-18,6,29]],inn:[[-49,11,11],[-39,8,-1]],orrery:[[15,17,12],[3,12,-3]],square:[[-31,6,16],[-24,2,7]],roofgarden:[[-38,18,-8],[-28,11,-18]],mill:[[33,10,39],[20,5,27]],archway:[[39,10,21],[28,5,9]],canal:[[31,7,33],[17,3,14]],rooftop:[[-5,21,13],[-20,7,0]],belfry:[[-4,27,-17],[-13,23,-32]],drone:[[0,33,45],[-8,6,-5]],train:[[52,6,-27],[5,7,-10]]};
function setView(v){view=v;followMode=false;document.getElementById('follow').classList.remove('active');const[p,t]=viewMap[v];camera.position.fromArray(p);controls.target.fromArray(t);controls.enabled=!['drone','train'].includes(v);document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}
function setWeather(w){rain.visible=w==='rain';lit.forEach(m=>m.emissiveIntensity=w==='blackout'?0:.65);ovenGlow.intensity=w==='blackout'?0:2.2;const cfg={clear:[0x9eaaa3,.0018,1.35,1.85,1.02,.18],rain:[0x5d6b70,.010,.7,.38,.78,.30],fog:[0x929b96,.0145,.86,.48,.80,.38],blackout:[0x071017,.012,.12,.02,.48,.18],dawn:[0x5f6c7d,.009,.48,.42,.68,.34],night:[0x07111d,.010,.25,.05,.58,.55]}[w];scene.background.set(cfg[0]);scene.fog.color.set(cfg[0]);scene.fog.density=cfg[1];hemi.intensity=cfg[2];sun.intensity=cfg[3];renderer.toneMappingExposure=cfg[4];bloom.strength=cfg[5];sun.color.set(w==='dawn'?0xd58b62:0xffe2b5);document.querySelectorAll('#weather button').forEach(b=>b.classList.toggle('active',b.dataset.w===w))}
document.getElementById('weather').onclick=e=>e.target.dataset.w&&setWeather(e.target.dataset.w);document.getElementById('views').onclick=e=>e.target.dataset.v&&setView(e.target.dataset.v);residentSel.onchange=e=>followIdx=+e.target.value;
follow.onclick=()=>{followMode=!followMode;follow.classList.toggle('active',followMode);controls.enabled=!followMode};fullscreen.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();toggle.onclick=()=>{panel.classList.toggle('collapsed');toggle.textContent=panel.classList.contains('collapsed')?'操作':'街を見る'};if(innerWidth<701)panel.classList.add('collapsed');
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();if(wheel)wheel.rotation.z=-t*.22;if(orrery)orrery.rotation.y=t*.08;if(orrery)orrery.rotation.x=Math.sin(t*.05)*.12;train.position.z=((t*3.2)%95)-48;routes.forEach((r,i)=>{const u=(Math.sin(t*r.s+i)+1)/2;r.p.position.lerpVectors(r.a,r.b,u);r.p.lookAt(u<.5?r.b:r.a)});const ru=(Math.sin(t*.11)+1)/2;residentV8.position.lerpVectors(new THREE.Vector3(-13,1.1,24),new THREE.Vector3(-4,1.1,24),ru);residentV8.rotation.y=ru<.5?Math.PI/2:-Math.PI/2;const cu=(Math.sin(t*.18)+1)/2;cat.position.lerpVectors(new THREE.Vector3(-39,1.12,27.4),new THREE.Vector3(-13,1.12,18.5),cu);cat.rotation.y=cu<.5?-1.2:1.95;
smoke.forEach((q,i)=>{const u=(t*.09+i/smoke.length)%1;const cs=chimneySources[i%chimneySources.length];q.position.set(cs[0]+Math.sin(t*.4+i)*.45,cs[1]+u*12,cs[2]+Math.cos(t*.35+i)*.35);q.scale.setScalar(.5+u*2.3);q.material.opacity=.14*(1-u)});if(rain.visible){const p=rg.attributes.position.array;for(let i=0;i<N;i++){p[i*3+1]-=.48;if(p[i*3+1]<0)p[i*3+1]=65}rg.attributes.position.needsUpdate=true}if(view==='drone'&&!followMode){camera.position.set(Math.sin(t*.07)*52,29+Math.sin(t*.11)*4,Math.cos(t*.07)*52);camera.lookAt(-8,6,-4)}if(view==='train'&&!followMode){camera.position.set(52,5.7,train.position.z+7);camera.lookAt(3,6,train.position.z-4)}if(followMode){const p=residents[followIdx],d=new THREE.Vector3();p.getWorldDirection(d);camera.position.lerp(p.position.clone().add(new THREE.Vector3(0,2.8,0)).add(d.multiplyScalar(-4.5)),.07);camera.lookAt(p.position.clone().add(new THREE.Vector3(0,1.4,0)))}controls.update();composer.render()}
setView('overview');setWeather('clear');animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});loading.classList.add('hide');
