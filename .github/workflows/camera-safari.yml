name: Safari camera investigation
on:
  push:
    branches: [iphone-camera-safari, iphone-camera-region, feat/npc-social-work, feat/npc-building-transitions, main]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test package
        timeout-minutes: 2
        run: npm install --no-save --no-package-lock playwright
      - name: Browser system dependencies
        timeout-minutes: 4
        run: npx playwright install-deps ${{ matrix.engine }}
      - name: Browser download
        timeout-minutes: 3
        run: |
          npx playwright install ${{ matrix.engine }}
          if [ '${{ matrix.engine }}' = chromium ]; then sudo ln -sf "$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" /usr/bin/chromium; fi
      - name: Serve test origin
        run: python3 -m http.server 8001 --bind 127.0.0.1 > /tmp/camera-server.log 2>&1 &
      - name: Camera diagnostic and directional regression
        env:
          CAMERA_ENGINE: ${{ matrix.engine }}
        run: node tools/camera-safari-browser.cjs
      - name: Existing touch and PC regression
        if: matrix.engine == 'chromium' && (success() || failure())
        run: |
          node tools/mobile-interaction.cjs
          node tools/mobile-pc-regression.cjs
          node tools/mobile-scroll-recovery.cjs
      - name: Portrait and water Node regressions
        if: matrix.engine == 'chromium'
        run: |
          for test in tools/check_*.mjs; do node "$test"; done
      - name: Portrait and water browser acceptance
        timeout-minutes: 10
        env:
          ORLAITHE_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          node tools/portrait-completion.cjs
          node tools/portrait-travellers.cjs
          node tools/portrait-guests.cjs
          node tools/portrait-guests-native.cjs
          node tools/water-advice-browser.cjs
          node tools/capital-portraits.cjs
      - name: NPC life movement acceptance
        timeout-minutes: 5
        env:
          ORLAITHE_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          node tools/npc-life-acceptance.cjs
          node tools/npc-route-recovery.cjs
          node tools/npc-life-lifecycle.cjs
          node tools/npc-social-priority.cjs
          node tools/npc-social-acceptance.cjs
      - name: NPC building entry and exit acceptance
        timeout-minutes: 8
        env:
          ORLAITHE_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          node tools/npc-door-acceptance.cjs
          node tools/npc-door-room.cjs
          node tools/npc-door-regions.cjs
          node tools/npc-door-priority.cjs
          node tools/npc-door-lifecycle.cjs
      - name: Existing lodging entry regression
        timeout-minutes: 5
        env:
          ORLAITHE_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          node tools/lodging-life-audit.cjs
          node tools/lodging-return-audit.cjs
          node tools/lodging-night-dialogue.cjs
