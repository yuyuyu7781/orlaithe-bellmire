name: iPhone follow-up verification
on:
  push:
    branches: [iphone-followup, main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo ln -sf "$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" /usr/bin/chromium
      - name: Serve test origin
        run: python3 -m http.server 8001 --bind 127.0.0.1 > /tmp/iphone-server.log 2>&1 &
      - name: Reproduce iPhone reports
        run: node tools/iphone-followup-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-followup
          path: /tmp/iphone-*.json
