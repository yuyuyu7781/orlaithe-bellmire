name: Bellmire v8.7 street life
on:
  push:
    paths:
      - '.github/workflows/bellmire-v87.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_v87.py
      - run: |
          git config user.name bellmire-builder
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "Bellmire v8.7 street life" || exit 0
          git push
