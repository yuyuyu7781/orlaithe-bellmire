name: Bellmire v10.1 waterfront
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bellmire-v101.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch waterfront
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Bellmire v10.0 — Orlaithe miniature','Bellmire v10.1 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v10.0','Orlaithe miniature · v10.1')
          marker='const residents=[];'
          patch=r'''// v10.1 — definitive south waterfront pass, intentionally late so cleanup sees every older mesh
const waterfront101=new THREE.Group();scene.add(waterfront101);
const water101=M(0x356d76,.18,.10), dock101=M(0x67462f,.97), dockDark101=M(0x382a22,.98), stone101=M(0x777267,.98), sail101=M(0xa99b7d,.98), lamp101=M(0xe9b45d,.9);
scene.traverse(o=>{
  if(!o.isMesh || !o.geometry || !o.geometry.parameters || o.parent===waterfront101) return;
  const g=o.geometry.parameters,p=o.position;
  const w=g.width||0,h=g.height||0,d=g.depth||0,a=Math.max(w,d),b=Math.min(w,d);
  if(p.z>26 && p.y<4.2 && a>14 && b<11 && h>1.2) o.visible=false;
});
box(0,1.03,40.5,74,.20,10.5,water101,waterfront101);
for(const q of [[-31,35.0,10],[-17,35.0,7],[-5,35.0,6],[8,35.0,7],[22,35.0,8],[33,35.0,5]]) box(q[0],1.14,q[1],q[2],.55,1.0,stone101,waterfront101);
for(const x of [-18,11]){
  for(let i=0;i<7;i++) box(x,1.22,35.8+i*1.18,3.4,.16,1.02,dock101,waterfront101);
  for(const z of [36.0,42.6]) for(const dx of [-1.35,1.35]) box(x+dx,.55,z,.20,1.55,.20,dockDark101,waterfront101);
}
for(const q of [[-20,36.1],[-16.8,36.4],[8.8,36.0],[12.5,36.4]]) box(q[0],1.38,q[1],1.05,.72,.9,dock101,waterfront101);
for(const q of [[-21.5,39.0],[-14.5,42.0],[8.0,39.5],[14.0,42.2]]) box(q[0],1.15,q[1],.22,1.45,.22,dockDark101,waterfront101);
const skiff101=new THREE.Mesh(new THREE.CylinderGeometry(.55,.9,5.0,6),dockDark101);skiff101.rotation.z=Math.PI/2;skiff101.scale.set(1,.48,1.35);skiff101.position.set(-3,1.28,41.5);waterfront101.add(skiff101);
box(-3,1.55,41.5,3.4,.12,.5,dock101,waterfront101);
for(const x of [24.2,29.8]) box(x,1.18,35.7,.14,2.6,.14,dockDark101,waterfront101);
box(27,3.65,35.7,6.1,.12,2.0,sail101,waterfront101);box(27,1.25,35.7,4.8,.75,1.25,dock101,waterfront101);
for(const x of [-24,18,32]){box(x,1.18,34.8,.14,2.5,.14,dockDark101,waterfront101);const l=new THREE.Mesh(new THREE.SphereGeometry(.18,9,7),lamp101);l.position.set(x,3.55,34.8);waterfront101.add(l);lit.push(lamp101);}

'''
          if marker not in s: raise SystemExit('marker missing')
          s=s.replace(marker,patch+marker,1)
          p.write_text(s)
      - name: Commit v10.1
        run: |
          git config user.name 'bellmire-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Bellmire v10.1: rebuild south waterfront'
          git push
# trigger
