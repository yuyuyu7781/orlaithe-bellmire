name: Bellmire v10.1 expanded waterfront
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand waterfront after all previous town geometry
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='const residents=[];'
          add=r'''
          // v10.1 — definitive south waterfront, inserted late so the stubborn foreground slab already exists
          const waterfront101=new THREE.Group();scene.add(waterfront101);
          const water101=M(0x356d76,.18,.10),dock101=M(0x67462f,.97),dockDark101=M(0x382a22,.98),stone101=M(0x777267,.98),sail101=M(0xa99b7d,.98),lamp101=M(0xe9b45d,.90);
          scene.traverse(o=>{if(!o.isMesh||!o.geometry||!o.geometry.parameters||o.parent===waterfront101)return;const g=o.geometry.parameters,p=o.position,w=g.width||0,h=g.height||0,d=g.depth||0,a=Math.max(w,d),b=Math.min(w,d);if(p.z>24&&p.y<4.2&&a>14&&b<12&&h>1.2)o.visible=false;});
          // broad water surface replacing the visually dead south strip
          box(0,1.03,40.5,74,.20,10.5,water101,waterfront101);
          // broken quay edge with gaps to the piers
          for(const q of [[-31,35,10],[-17,35,7],[-5,35,6],[8,35,7],[22,35,8],[33,35,5]])box(q[0],1.14,q[1],q[2],.55,1,stone101,waterfront101);
          // two piers extending visibly into water
          for(const x of [-18,11]){for(let i=0;i<7;i++)box(x,1.22,35.8+i*1.18,3.4,.16,1.02,dock101,waterfront101);for(const z of [36,42.6])for(const dx of [-1.35,1.35])box(x+dx,.55,z,.20,1.55,.20,dockDark101,waterfront101);}
          // cargo and mooring clutter
          for(const q of [[-20,36.1],[-16.8,36.4],[8.8,36],[12.5,36.4]])box(q[0],1.38,q[1],1.05,.72,.9,dock101,waterfront101);
          for(const q of [[-21.5,39],[-14.5,42],[8,39.5],[14,42.2]])box(q[0],1.15,q[1],.22,1.45,.22,dockDark101,waterfront101);
          // small moored skiff
          const skiff101=new THREE.Mesh(new THREE.CylinderGeometry(.55,.9,5,6),dockDark101);skiff101.rotation.z=Math.PI/2;skiff101.scale.set(1,.48,1.35);skiff101.position.set(-3,1.28,41.5);waterfront101.add(skiff101);box(-3,1.55,41.5,3.4,.12,.5,dock101,waterfront101);
          // waterside stall + lamps
          for(const x of [24.2,29.8])box(x,1.18,35.7,.14,2.6,.14,dockDark101,waterfront101);box(27,3.65,35.7,6.1,.12,2,sail101,waterfront101);box(27,1.25,35.7,4.8,.75,1.25,dock101,waterfront101);
          for(const x of [-24,18,32]){box(x,1.18,34.8,.14,2.5,.14,dockDark101,waterfront101);const l=new THREE.Mesh(new THREE.SphereGeometry(.18,9,7),lamp101);l.position.set(x,3.55,34.8);waterfront101.add(l);lit.push(lamp101);}
          '''
          if 'v10.1 — definitive south waterfront' not in s:
              if marker not in s: raise SystemExit('residents marker missing')
              s=s.replace(marker,add+'\n'+marker,1)
          s=s.replace('Bellmire v10.0 — Orlaithe miniature','Bellmire v10.1 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v10.0','Orlaithe miniature · v10.1')
          p.write_text(s)
      - name: Commit v10.1
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v10.1 expanded waterfront' || exit 0
          git push
