name: Bellmire v8.4.1 tavern hotfix
on:
  push:
    paths: ['.github/workflows/v83.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicate tavern glow name
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          marker='// ===== v8.4 tavern district ====='
          if marker not in s: raise SystemExit('v8.4 tavern marker not found')
          head, tail = s.split(marker, 1)
          tail = tail.replace('const tavernGlow=', 'const tavernWindowGlow=', 1)
          tail = tail.replace('lit.push(tavernGlow)', 'lit.push(tavernWindowGlow)', 1)
          tail = tail.replace('tavernGlow);', 'tavernWindowGlow);')
          s = head + marker + tail
          s=s.replace('Bellmire v8.4 — Orlaithe miniature','Bellmire v8.4.1 — Orlaithe miniature').replace('Orlaithe miniature · v8.4','Orlaithe miniature · v8.4.1')
          p.write_text(s)
      - name: Commit hotfix
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Bellmire v8.4 tavern glow collision' || exit 0
          git push
