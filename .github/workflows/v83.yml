name: Bellmire v9.3 backstreet workshop
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add backstreet craft workshop
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='// v8.3.1 millstream: one readable flow line through the wheel'
          add=r'''
          // v9.3 — backstreet workshop: work, storage and small signs of craft
          const craftYard=new THREE.Group();scene.add(craftYard);
          const craftWood=M(0x4a3023,.98), craftDark=M(0x292720,.98), craftMetal=M(0x55544c,.98), emberMat=M(0xd18445,.98);
          // long workbench and chopping/stool blocks
          box(11.8,3.72,-7.7,3.4,.34,.72,craftWood,craftYard);
          for(const q of [[10.5,-6.6],[12.8,-6.45],[13.8,-8.5]]) box(q[0],3.62,q[1],.55,.55,.55,craftWood,craftYard);
          // tool rack against the lane edge
          box(14.15,4.45,-7.1,.14,2.15,3.1,craftDark,craftYard);
          for(const z of [-8.05,-7.35,-6.65]){box(13.98,4.55,z,.52,.08,.08,craftMetal,craftYard);box(13.72,4.25,z,.08,.72,.08,craftMetal,craftYard)}
          // low forge/brazier with restrained warm glow
          const forge=new THREE.Mesh(new THREE.CylinderGeometry(.62,.72,.42,10),craftDark);forge.position.set(10.25,3.75,-8.55);craftYard.add(forge);
          const coal=new THREE.Mesh(new THREE.CylinderGeometry(.38,.42,.08,10),emberMat);coal.position.set(10.25,4.0,-8.55);craftYard.add(coal);
          const forgeGlow=new THREE.PointLight(0xd18445,.55,5.5);forgeGlow.position.set(10.25,4.45,-8.55);craftYard.add(forgeGlow);
          // timber stock and a handcart: messy enough to feel worked-in
          for(const q of [[11.0,-9.35,1.8],[12.15,-9.5,1.35],[13.05,-9.25,1.65]]) box(q[0],3.55,q[1],q[2],.18,.24,craftWood,craftYard);
          box(12.25,3.68,-5.85,1.35,.28,.82,craftWood,craftYard);
          const wheelGeo=new THREE.TorusGeometry(.28,.07,6,12);for(const x of [11.75,12.75]){const w=new THREE.Mesh(wheelGeo,craftDark);w.position.set(x,3.52,-5.45);w.rotation.y=Math.PI/2;craftYard.add(w)}
          // one worker keeps this corner from becoming another decorative set
          const worker=new THREE.Group();craftYard.add(worker);const body=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,.78,8),M(0x596052,.98));body.position.set(11.15,4.05,-7.0);worker.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.2,8,6),M(0xb98c68,.98));head.position.set(11.15,4.58,-7.0);worker.add(head);
          '''
          if 'v9.3 — backstreet workshop' not in s:
              if marker not in s: raise SystemExit('millstream marker missing')
              s=s.replace(marker,add+'\n'+marker,1)
          for a,b in [('Bellmire v9.2 — Orlaithe miniature','Bellmire v9.3 — Orlaithe miniature'),('Orlaithe miniature · v9.2','Orlaithe miniature · v9.3')]: s=s.replace(a,b)
          p.write_text(s)
      - name: Commit v9.3
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v9.3 backstreet workshop' || exit 0
          git push
