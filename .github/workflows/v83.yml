name: Bellmire v8.6 shopfront life
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bakery bookshop and inn identity
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="const tavernWarm=new THREE.PointLight(0xff9b4a,.9,8);tavernWarm.position.set(-10,5.0,14.4);scene.add(tavernWarm);"
          add=r'''
          // v8.6 — lived-in shopfronts: bakery, bookshop, inn
          const shopLife=new THREE.Group();scene.add(shopLife);
          // bakery: striped awning, bread crates and warm doorway
          box(-31,3.5,27.15,5.6,.16,1.8,v8Cloth,shopLife);
          for(const x of [-33.4,-28.6]) box(x,3.5,27.0,.14,2.7,.14,v8Wood,shopLife);
          box(-31,3.55,27.75,2.2,.55,1.05,v8Wood,shopLife);
          for(const x of [-31.7,-31,-30.3]){const loaf=new THREE.Mesh(new THREE.SphereGeometry(.27,10,6),M(0xb9824f,.9));loaf.scale.set(1.45,.55,.8);loaf.position.set(x,4.2,27.72);shopLife.add(loaf)}
          const bakeLamp=new THREE.PointLight(0xffb45f,.8,7);bakeLamp.position.set(-31,5.1,27.8);scene.add(bakeLamp);
          // bookshop: projecting sign, narrow display table and stacked book blocks
          box(-18,4.8,32.05,.12,2.2,.12,v8Iron,shopLife);box(-17.25,6.55,32.05,1.35,.72,.14,v8Wood,shopLife);
          box(-18,3.55,32.45,3.5,.72,.8,v8Wood,shopLife);
          const bookMats=[M(0x6d4b43,.9),M(0x4d5a4c,.9),M(0x6a5c3e,.9)];
          for(let i=0;i<7;i++) box(-19.2+i*.4,4.28+(i%2)*.08,32.45,.34,.10,.48,bookMats[i%3],shopLife);
          const bookLamp=new THREE.PointLight(0xe9a65a,.62,6);bookLamp.position.set(-18,5.3,32.7);scene.add(bookLamp);
          // inn: covered arrival bench, luggage and paired lanterns
          box(-39,3.55,3.55,5.8,.18,1.75,v8Cloth,shopLife);
          for(const x of [-41.5,-36.5]) box(x,3.5,3.35,.15,2.8,.15,v8Wood,shopLife);
          box(-39,3.55,4.15,2.7,.45,.72,v8Wood,shopLife);
          box(-41.1,3.55,4.35,.7,.9,.55,v8Wood,shopLife);box(-40.3,3.55,4.4,.55,.65,.48,v8Wood,shopLife);
          for(const x of [-41.7,-36.3]){const lm=new THREE.MeshStandardMaterial({color:0xf1bd70,emissive:0xff9a3c,emissiveIntensity:1.25});const l=new THREE.Mesh(new THREE.SphereGeometry(.14,8,6),lm);l.position.set(x,5.65,3.75);shopLife.add(l);lit.push(lm)}
          '''
          if 'v8.6 — lived-in shopfronts' not in s:
              if marker not in s: raise SystemExit('v8.5 marker missing')
              s=s.replace(marker,marker+add,1)
          s=s.replace('Bellmire v8.5 — Orlaithe miniature','Bellmire v8.6 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v8.5','Orlaithe miniature · v8.6')
          p.write_text(s)
      - name: Commit v8.6
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v8.6 lived-in shopfronts' || exit 0
          git push
# trigger 2026-10-02
