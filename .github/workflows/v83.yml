name: Bellmire v8.9 street life
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add street residents and daily life
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='// v8.3.1 millstream: one readable flow line through the wheel'
          add=r'''
          // v8.9 — visible street life: residents, carts and everyday objects
          const streetLife=new THREE.Group();scene.add(streetLife);
          const coat=[M(0x66584e,.96),M(0x58635b,.96),M(0x796353,.96),M(0x59606a,.96)];
          function resident(x,z,i){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.24,.34,1.05,8),coat[i%coat.length]);body.position.y=.65;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,9,7),M(0xb58b6d,.96));head.position.y=1.42;g.add(head);g.position.set(x,3.5,z);streetLife.add(g)}
          [[7,10,0],[11,6,1],[17,12,2],[22,7,3],[-18,29,1],[-24,31,2]].forEach(q=>resident(...q));
          // handcarts near market and shop lane
          for(const q of [[10,3.5,14],[20,3.5,10],[-21,3.5,29]]){box(q[0],q[1]+.55,q[2],1.65,.55,.95,v8Wood,streetLife);for(const dx of [-.62,.62]){const w=new THREE.Mesh(new THREE.TorusGeometry(.28,.08,7,12),v8Iron);w.rotation.y=Math.PI/2;w.position.set(q[0]+dx,q[1]+.32,q[2]+.52);streetLife.add(w)}box(q[0],q[1]+.62,q[2]-1.05,.12,.12,1.35,v8Wood,streetLife)}
          // sacks and baskets clustered rather than evenly scattered
          for(const q of [[8.5,3.72,5.0],[9.2,3.72,5.3],[18.5,3.72,4.5],[-26,3.72,30]]){const b=new THREE.Mesh(new THREE.SphereGeometry(.34,8,6),M(0x9a8264,.95));b.scale.set(1,.7,.85);b.position.set(...q);streetLife.add(b)}
          '''
          if 'v8.9 — visible street life' not in s:
              if marker not in s: raise SystemExit('millstream marker missing')
              s=s.replace(marker,add+'\n'+marker,1)
          s=s.replace('Bellmire v8.8 — Orlaithe miniature','Bellmire v8.9 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v8.8','Orlaithe miniature · v8.9')
          p.write_text(s)
      - name: Commit v8.9
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v8.9 street life' || exit 0
          git push
