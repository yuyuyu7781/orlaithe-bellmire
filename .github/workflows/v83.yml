name: Bellmire v9.1 market texture fix
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicate cloth declaration
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('const cloth=[M(0x80594a,.96),M(0x6b7057,.96),M(0x8b7358,.96)];','const marketCloth=[M(0x80594a,.96),M(0x6b7057,.96),M(0x8b7358,.96)];')
          s=s.replace('cloth[q[2]]);a.position.set(q[0],5.15,q[1])','marketCloth[q[2]]);a.position.set(q[0],5.15,q[1])')
          p.write_text(s)
      - name: Commit v9.1 fix
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix v9.1 duplicate cloth variable' || exit 0
          git push
