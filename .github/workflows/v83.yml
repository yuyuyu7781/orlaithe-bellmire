name: Bellmire v8.8 market square details
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add square stalls and street detail
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='// v8.3.1 millstream: one readable flow line through the wheel'
          add=r'''
          // v8.8 — market-square texture: stalls, benches, planters and lane clutter
          const squareLife=new THREE.Group();scene.add(squareLife);
          const stallCloth=[M(0x7b5c4e,.96),M(0x6d745e,.96),M(0x92745d,.96)];
          for(const q of [[8,3.5,6,0],[13,3.5,8,1],[18,3.5,5,2]]){
            box(q[0],q[1]+.55,q[2],3.0,.25,1.25,v8Wood,squareLife);
            box(q[0],q[1]+2.4,q[2],3.5,.18,1.65,stallCloth[q[3]],squareLife);
            for(const dx of [-1.35,1.35]) box(q[0]+dx,q[1]+1.35,q[2],.12,2.7,.12,v8Wood,squareLife);
            for(let i=0;i<4;i++) box(q[0]-1.05+i*.7,q[1]+.82,q[2]-.05,.42,.18,.42,M(i%2?0x8b6a43:0x65704c,.95),squareLife);
          }
          // benches and planters around the open square
          for(const q of [[4,3.5,12],[21,3.5,12],[15,3.5,16]]){box(q[0],q[1]+.45,q[2],2.25,.28,.55,v8Wood,squareLife);box(q[0]-.8,q[1]+.15,q[2],.18,.7,.45,v8Wood,squareLife);box(q[0]+.8,q[1]+.15,q[2],.18,.7,.45,v8Wood,squareLife)}
          for(const q of [[6,3.75,15],[23,3.75,9],[11,3.75,18]]){const pot=new THREE.Mesh(new THREE.CylinderGeometry(.38,.3,.55,10),M(0x805a45,.94));pot.position.set(...q);squareLife.add(pot);const plant=new THREE.Mesh(new THREE.IcosahedronGeometry(.52,1),moss);plant.scale.set(.9,1.25,.9);plant.position.set(q[0],q[1]+.55,q[2]);squareLife.add(plant)}
          // modest signposts make lanes feel navigable
          for(const q of [[2,3.5,8],[20,3.5,18]]){box(q[0],q[1]+1.3,q[2],.13,2.6,.13,v8Iron,squareLife);box(q[0]+.55,q[1]+2.25,q[2],1.25,.42,.12,v8Wood,squareLife)}
          '''
          if 'v8.8 — market-square texture' not in s:
              if marker not in s: raise SystemExit('millstream marker missing')
              s=s.replace(marker,add+'\n'+marker,1)
          s=s.replace('Bellmire v8.7 — Orlaithe miniature','Bellmire v8.8 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v8.7','Orlaithe miniature · v8.8')
          p.write_text(s)
      - name: Commit v8.8
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v8.8 market square details' || exit 0
          git push
