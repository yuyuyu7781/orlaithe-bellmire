name: Bellmire cat path fix
on:
  push:
    paths: ['.github/workflows/v83.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cat movement
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          a="const catPath=[new THREE.Vector3(-34,1.34,34),new THREE.Vector3(-29,1.34,34),new THREE.Vector3(-25,1.34,34),new THREE.Vector3(-22,1.34,33),new THREE.Vector3(-18,1.34,33)];"
          b="const catPath=[new THREE.Vector3(-39,1.38,12.8),new THREE.Vector3(-36,1.38,12.8),new THREE.Vector3(-33,1.38,12.8),new THREE.Vector3(-30,1.38,12.8),new THREE.Vector3(-27,1.38,12.8)];"
          s=s.replace(a,b)
          s=s.replace("cat.position.copy(_catPos);cat.lookAt(catTarget.x,cat.position.y,catTarget.z);","cat.position.copy(_catPos);const catDir=catTarget.clone().sub(cat.position);cat.rotation.y=Math.atan2(catDir.x,catDir.z)-Math.PI/2;")
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix cat movement' || exit 0
          git push
