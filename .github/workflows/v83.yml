name: Bellmire v9.9 working waterfront fix
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix waterfront lamp helper
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="for(const x of [-7,20]){box(x,1.35,28.7,.18,2.7,.18,dark99,quay99);sphere(x,2.82,28.7,.22,lamp99,quay99);}"
          new="for(const x of [-7,20]){box(x,1.35,28.7,.18,2.7,.18,dark99,quay99);const glow99=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),lamp99);glow99.position.set(x,2.82,28.7);quay99.add(glow99);}"
          if old in s:
              s=s.replace(old,new,1)
          elif 'sphere(x,2.82,28.7,.22,lamp99,quay99)' in s:
              s=s.replace('sphere(x,2.82,28.7,.22,lamp99,quay99)','(()=>{const glow99=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),lamp99);glow99.position.set(x,2.82,28.7);quay99.add(glow99);})()',1)
          else:
              raise SystemExit('v9.9 lamp call not found')
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix v9.9 waterfront lamp geometry' || exit 0
          git push
