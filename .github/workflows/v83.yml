name: Bellmire v10.3 waterfront homes
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add waterfront homes and shore details
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='const residents=[];'
          add=r'''
          // v10.3 waterfront homes and shore details
          const shore103=new THREE.Group();scene.add(shore103);
          const w103=M(0x756b54,.98),d103=M(0x2f3026,.98),wd103=M(0x65442f,.98),rf103=M(0x26392d,.98),c103=M(0xb78366,.98),l103=M(0xe9b45d,.9);
          function hut103(x,z){box(x,3.05,z,5.2,3.7,4.2,w103,shore103);const r=new THREE.Mesh(new THREE.ConeGeometry(3.7,1.35,4),rf103);r.position.set(x,5.55,z);r.rotation.y=Math.PI/4;shore103.add(r);box(x,2.65,z+2.12,.8,1.4,.08,l103,shore103);}
          hut103(-29,32.0);hut103(18,32.0);
          box(-4.7,1.2,33,.13,2.4,.13,d103,shore103);box(.3,1.2,33,.13,2.4,.13,d103,shore103);box(-2.2,3.5,33,5.2,.12,1.9,c103,shore103);box(-2.2,1.5,33,4.3,.55,1,wd103,shore103);
          box(7,1.2,32.7,.12,2.4,.12,d103,shore103);box(12,1.2,32.7,.12,2.4,.12,d103,shore103);box(9.5,3.35,32.7,5,.05,.05,d103,shore103);
          for(const x of [8,9.5,11])box(x,2.95,32.72,.9,.7,.05,c103,shore103);
          for(const q of [[-24,33],[-21.8,33.2],[-8,32.8],[3.2,33],[14,33],[22.5,32.8],[29,33]])box(q[0],1.48,q[1],1,.62,.82,wd103,shore103);
          '''
          if 'v10.3 waterfront homes and shore details' not in s:
              if marker not in s: raise SystemExit('residents marker missing')
              s=s.replace(marker,add+'\n'+marker,1)
          s=s.replace('Bellmire v10.2 — Orlaithe miniature','Bellmire v10.3 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v10.2','Orlaithe miniature · v10.3')
          p.write_text(s)
      - name: Commit v10.3
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v10.3 waterfront homes' || exit 0
          git push
