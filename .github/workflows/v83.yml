name: Bellmire v8.3 patch
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Bellmire to v8.3
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Bellmire v8.2 — Orlaithe miniature','Bellmire v8.3 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v8.2','Orlaithe miniature · v8.3')
          s=s.replace('<button data-v="inn">宿屋</button>','<button data-v="inn">宿屋</button><button data-v="tavern">酒場</button>')
          anchor='const M=(c,r=.85,m=.02)=>new THREE.MeshStandardMaterial'
          seeded="let bellSeed=0xB311A5;function bellRand(){bellSeed=(bellSeed*1664525+1013904223)>>>0;return bellSeed/4294967296;}\n"
          if 'function bellRand()' not in s: s=s.replace(anchor,seeded+anchor)
          s=s.replace('Math.random()', 'bellRand()')
          tavern='''
// v8.3 — The Copper Kettle tavern: a warm social anchor on the lower lane
shopShell(-10,8,1.1,7.2,5.8,7.0,winePlaster,2.3);
doorDetail(-10,1.2,10.96,v8Wood);
box(-10,5.9,11.02,4.4,.72,.16,v8Wood);
v8Sign(-13.0,4.8,11.05);
barrel(-13.1,10.7,1.1);barrel(-11.8,10.9,1.1);
const tavernGlow=new THREE.PointLight(0xffa85c,1.55,13);tavernGlow.position.set(-10,4.8,11.8);scene.add(tavernGlow);
for(const xx of [-12.1,-7.9]) tinyWindow(xx,5.1,11.0,.85,1.15);
'''
          marker='// Orrery House — celestial instrument shop with copper dome and exterior rings'
          if 'The Copper Kettle tavern' not in s: s=s.replace(marker,tavern+'\n'+marker)
          hydraulic='''
// v8.3 mill hydraulics — water is visibly delivered from higher ground to the wheel
box(28,5.05,27,12,.28,2.4,water);
box(22.9,3.55,27,2.0,.24,5.2,water);
box(22.9,3.15,27,2.5,.35,5.5,warmStone);
box(21,.10,34,3.2,.34,14,water);
for(const zz of [21,33]) box(21,.18,zz,5.2,.42,.7,path);
'''
          marker2='// hillside stairs weaving between east houses'
          if 'v8.3 mill hydraulics' not in s: s=s.replace(marker2,hydraulic+'\n'+marker2)
          s=s.replace('wheel.position.set(21.05,2.65,27)', 'wheel.position.set(21.05,3.75,27)')
          s=s.replace('axle.position.set(21.05,2.65,27)', 'axle.position.set(21.05,3.75,27)')
          s=s.replace('new THREE.Vector3(-35,1.15,28),b:new THREE.Vector3(-24,1.15,28)', 'new THREE.Vector3(-35,1.38,28),b:new THREE.Vector3(-24,1.38,28)')
          s=s.replace('new THREE.Vector3(-39,1.15,12),b:new THREE.Vector3(-27,1.15,12)', 'new THREE.Vector3(-39,1.38,12),b:new THREE.Vector3(-27,1.38,12)')
          s=s.replace('new THREE.Vector3(-12,4.72,-8),b:new THREE.Vector3(5,4.72,-8)', 'new THREE.Vector3(-12,4.95,-8),b:new THREE.Vector3(5,4.95,-8)')
          s=s.replace('new THREE.Vector3(12,1.15,19),b:new THREE.Vector3(12,1.15,24)', 'new THREE.Vector3(12,1.38,19),b:new THREE.Vector3(12,1.38,24)')
          s=s.replace('new THREE.Vector3(-13,1.1,24),new THREE.Vector3(-4,1.1,24)', 'new THREE.Vector3(-13,1.38,24),new THREE.Vector3(-4,1.38,24)')
          old='const catPath=[new THREE.Vector3(-36,1.12,30),new THREE.Vector3(-31,1.12,30),new THREE.Vector3(-27,1.12,27),new THREE.Vector3(-24,1.12,24),new THREE.Vector3(-20,1.12,24)];'
          new='const catPath=[new THREE.Vector3(-34,1.34,34),new THREE.Vector3(-29,1.34,34),new THREE.Vector3(-25,1.34,34),new THREE.Vector3(-22,1.34,33),new THREE.Vector3(-18,1.34,33)];'
          s=s.replace(old,new)
          catcam="if(view==='catview'&&!followMode){const cp=cat.position.clone();camera.position.lerp(cp.clone().add(new THREE.Vector3(-4.2,2.5,4.6)),.08);controls.target.lerp(cp.clone().add(new THREE.Vector3(0,.65,0)),.10);}"
          needle="if(view==='drone'&&!followMode){camera.position.set"
          if "view==='catview'&&!followMode" not in s: s=s.replace(needle,catcam+needle)
          s=s.replace("inn:[[-49,11,11],[-39,8,-1]],orrery:","inn:[[-49,11,11],[-39,8,-1]],tavern:[[-20,7,19],[-10,4,8]],orrery:")
          s=s.replace("canal:[[31,7,33],[17,3,14]]","canal:[[35,9,34],[22,3.8,27]]")
          p.write_text(s)
      - name: Commit v8.3
        run: |
          git config user.name "Bellmire Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Build Bellmire v8.3 watermill tavern and movement fixes" || exit 0
          git push
