name: Bellmire v8.4.2 tavern load fix
on:
  push:
    paths: ['.github/workflows/v83.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove tavern glow collision completely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('const tavernGlow=new THREE.PointLight(0xffa85c,1.55,13);tavernGlow.position.set(-10,4.8,11.8);scene.add(tavernWindowGlow);', 'const tavernPointGlow=new THREE.PointLight(0xffa85c,1.55,13);tavernPointGlow.position.set(-10,4.8,11.8);scene.add(tavernPointGlow);')
          s=s.replace('Bellmire v8.4.1 — Orlaithe miniature','Bellmire v8.4.2 — Orlaithe miniature').replace('Orlaithe miniature · v8.4.1','Orlaithe miniature · v8.4.2')
          if 'const tavernGlow=' in s: raise SystemExit('old tavernGlow declaration still exists')
          p.write_text(s)
      - name: Commit load fix
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Bellmire v8.4.2 tavern load' || exit 0
          git push
