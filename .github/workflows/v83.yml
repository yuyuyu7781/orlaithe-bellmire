name: Bellmire v8.5 street life
on:
  push:
    paths: ['.github/workflows/v83.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tavern street life
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          marker="const tavernPointGlowV843=new THREE.PointLight(0xff9b4a,1.25,10);tavernPointGlowV843.position.set(-10,5.1,13.2);scene.add(tavernPointGlowV843);"
          add=r'''
// v8.5 street-life layer around the tavern: fixed props, awning, table and warm spill
const tavernStreet=new THREE.Group();scene.add(tavernStreet);
box(-10,3.48,14.0,6.8,.10,3.0,path,tavernStreet);
box(-10,6.55,13.0,5.4,.16,2.15,v8Cloth,tavernStreet);
for(const px of [-12.45,-7.55]) box(px,3.5,13.65,.16,3.15,.16,v8Wood,tavernStreet);
box(-7.15,3.52,14.45,1.7,.16,1.05,v8Wood,tavernStreet);box(-7.15,3.68,14.45,.18,.85,.18,v8Wood,tavernStreet);
for(const sx of [-8.05,-6.25]) box(sx,3.5,14.45,.55,.48,.55,v8Wood,tavernStreet);
for(const bx of [-13.15,-12.45]){const b=new THREE.Mesh(new THREE.CylinderGeometry(.42,.47,.9,12),v8Wood);b.position.set(bx,3.95,14.25);tavernStreet.add(b)}
const tavernWarm=new THREE.PointLight(0xff9b4a,.9,8);tavernWarm.position.set(-10,5.0,14.4);scene.add(tavernWarm);
'''
          if marker not in s: raise SystemExit('tavern detail marker missing')
          s=s.replace(marker,marker+add,1)
          s=s.replace('Bellmire v8.4.5 — Orlaithe miniature','Bellmire v8.5 — Orlaithe miniature').replace('Orlaithe miniature · v8.4.5','Orlaithe miniature · v8.5')
          p.write_text(s)
      - name: Commit v8.5
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v8.5 tavern street life' || exit 0
          git push
