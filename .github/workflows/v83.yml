name: Bellmire v9.4 hillside neighborhood
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add a visible hillside residential quarter
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='// v8.3.1 millstream: one readable flow line through the wheel'
          add=r'''
          // v9.4 — hillside neighborhood: a whole readable residential pocket
          const hillQuarter=new THREE.Group();scene.add(hillQuarter);
          const hqPlaster=[M(0x9b927c,.96),M(0x827f72,.96),M(0x8b786f,.96)],hqRoof=[M(0x465047,.96),M(0x544940,.96),M(0x4b4d43,.96)];
          function hqHouse(x,y,z,w,d,h,i){box(x,y,z,w,h,d,hqPlaster[i%3],hillQuarter);const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,1.8,4),hqRoof[i%3]);r.rotation.y=Math.PI/4;r.position.set(x,y+h+.9,z);r.castShadow=true;hillQuarter.add(r);const lm=new THREE.MeshStandardMaterial({color:0xe8b56e,emissive:0xff9b43,emissiveIntensity:.75});for(const dx of [-w*.2,w*.2]){const win=new THREE.Mesh(new THREE.BoxGeometry(.42,.62,.08),lm);win.position.set(x+dx,y+h*.55,z+d/2+.05);hillQuarter.add(win)}lit.push(lm)}
          // clustered homes on an upper shelf, large enough to alter the skyline
          hqHouse(24,6.2,-25,5.2,4.5,5.8,0);hqHouse(30.2,6.2,-23.2,4.5,4.2,6.7,1);hqHouse(35.5,6.2,-26.0,5.0,4.6,5.4,2);hqHouse(28.0,6.2,-30.3,4.3,4.0,5.1,2);
          // stepped lane and retaining edge make the quarter connect to the town
          for(let i=0;i<7;i++) box(19.0+i*1.15,6.15+i*.16,-20.2-i*.65,1.5,.22,1.25,v8Stone,hillQuarter);
          box(30,6.05,-19.3,17,.55,1.0,v8Stone,hillQuarter);
          // tiny shared courtyard: tree, well, bench, laundry
          const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,2.2,8),v8Wood);trunk.position.set(32.2,7.3,-20.8);hillQuarter.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.35,1),moss);crown.scale.set(1.1,.9,1);crown.position.set(32.2,9.1,-20.8);hillQuarter.add(crown);
          const well=new THREE.Mesh(new THREE.CylinderGeometry(.72,.82,.65,12),v8Stone);well.position.set(27.8,6.55,-20.8);hillQuarter.add(well);box(35.2,6.35,-20.5,2.5,.28,.55,v8Wood,hillQuarter);
          box(25.0,9.0,-27.8,.1,2.4,.1,v8Wood,hillQuarter);box(30.0,9.0,-28.1,.1,2.4,.1,v8Wood,hillQuarter);box(27.5,10.05,-27.95,5,.05,.05,v8Iron,hillQuarter);
          const hqCloth=[M(0xa89a7f,.95),M(0x7b8270,.95),M(0x8d6d63,.95)];for(let i=0;i<3;i++)box(26.1+i*1.35,9.15,-27.93,.82,.9,.05,hqCloth[i],hillQuarter);
          // residents make it clearly domestic rather than another landmark
          const hqSkin=M(0xb78b6b,.96),hqCoat=[M(0x66584d,.96),M(0x596459,.96)];for(const q of [[29,6.2,-20.2,0],[34,6.2,-21.3,1]]){const b=new THREE.Mesh(new THREE.CylinderGeometry(.24,.34,1.0,8),hqCoat[q[3]]);b.position.set(q[0],q[1]+.55,q[2]);hillQuarter.add(b);const hd=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),hqSkin);hd.position.set(q[0],q[1]+1.3,q[2]);hillQuarter.add(hd)}
          '''
          if 'v9.4 — hillside neighborhood' not in s:
              if marker not in s: raise SystemExit('millstream marker missing')
              s=s.replace(marker,add+'\n'+marker,1)
          s=s.replace('Bellmire v9.3 — Orlaithe miniature','Bellmire v9.4 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v9.3','Orlaithe miniature · v9.4')
          p.write_text(s)
      - name: Commit v9.4
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v9.4 hillside neighborhood' || exit 0
          git push
