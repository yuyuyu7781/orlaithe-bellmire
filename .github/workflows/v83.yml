name: Bellmire v9.5 riverside quarter
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grow a riverside working quarter
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='// v8.3.1 millstream: one readable flow line through the wheel'
          add=r'''
          // v9.5 — riverside working quarter: sheds, bridge, dock and cargo
          const riverQuarter=new THREE.Group();scene.add(riverQuarter);
          const rqWood=M(0x4b382b,.96),rqDark=M(0x343b36,.96),rqPlaster=M(0x858276,.96);
          function rqShed(x,y,z,w,d,h){box(x,y,z,w,h,d,rqPlaster,riverQuarter);const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,1.45,4),rqDark);r.rotation.y=Math.PI/4;r.position.set(x,y+h+.72,z);riverQuarter.add(r)}
          rqShed(-38,1.2,-4.5,5.4,4.3,4.7);rqShed(-31.8,1.2,-6.4,4.6,4.0,5.4);rqShed(-43.0,1.2,-10.5,4.8,4.2,4.2);
          // timber footbridge across the stream, with irregular planks
          for(let i=0;i<9;i++) box(-30.5+i*.78,3.0,-14.2+(i%2)*.06,.66,.16,2.0,rqWood,riverQuarter);
          for(const x of [-30.8,-24.0]){box(x,3.0,-15.1,.12,1.25,.12,rqWood,riverQuarter);box(x,3.0,-13.3,.12,1.25,.12,rqWood,riverQuarter)}
          // dock/work platform and stacked cargo
          box(-39.0,1.15,-15.8,8.2,.38,3.0,rqWood,riverQuarter);
          for(const x of [-42,-39,-36]) box(x,.9,-15.2,.28,2.0,.28,rqWood,riverQuarter);
          for(const q of [[-41.0,1.55,-15.2,1.2,.8,.9],[-39.5,1.55,-15.4,.9,.65,.8],[-36.7,1.55,-15.0,1.15,.75,.9]]) box(q[0],q[1],q[2],q[3],q[4],q[5],rqWood,riverQuarter);
          for(const q of [[-42.0,-12.8],[-35.7,-11.8]]){const b=new THREE.Mesh(new THREE.CylinderGeometry(.42,.48,.86,10),rqWood);b.position.set(q[0],1.65,q[1]);riverQuarter.add(b)}
          // drying rack / nets give the water edge a working identity
          box(-44.2,2.2,-6.0,.12,2.5,.12,rqWood,riverQuarter);box(-40.5,2.2,-6.0,.12,2.5,.12,rqWood,riverQuarter);box(-42.35,4.45,-6.0,3.7,.08,.08,v8Iron,riverQuarter);
          const net=new THREE.Mesh(new THREE.PlaneGeometry(3.2,1.35,4,3),new THREE.MeshStandardMaterial({color:0x777262,roughness:1,wireframe:true}));net.position.set(-42.35,3.55,-6.02);riverQuarter.add(net);
          // warm work lamps so this district reads at night too
          for(const q of [[-38,4.5,-2.2],[-31.8,4.7,-4.25],[-40.0,3.2,-14.1]]){const lm=new THREE.MeshStandardMaterial({color:0xe6b56e,emissive:0xff9a42,emissiveIntensity:1});const l=new THREE.Mesh(new THREE.SphereGeometry(.14,8,6),lm);l.position.set(...q);riverQuarter.add(l);lit.push(lm)}
          '''
          if 'v9.5 — riverside working quarter' not in s:
              if marker not in s: raise SystemExit('millstream marker missing')
              s=s.replace(marker,add+'\n'+marker,1)
          s=s.replace('Bellmire v9.4 — Orlaithe miniature','Bellmire v9.5 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v9.4','Orlaithe miniature · v9.5')
          p.write_text(s)
      - name: Commit v9.5
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v9.5 riverside working quarter' || exit 0
          git push
