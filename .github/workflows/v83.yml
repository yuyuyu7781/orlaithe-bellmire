name: Bellmire v10.5 waterfront activity
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add waterfront activity
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='const residents=[];'
          add=r'''
          // v10.5 waterfront activity: nets, fish racks, shore cargo, small boat details
          const port105=new THREE.Group();scene.add(port105);
          const wood105=M(0x5c3d2b,.98),rope105=M(0x8b7757,.98),fish105=M(0x8b9a86,.95),cloth105=M(0x7c6654,.98),dark105=M(0x292c27,.98),warm105=M(0xe9b45d,.9);
          function rack105(x,z){for(const dx of [-1.2,1.2])box(x+dx,1.5,z,.11,2.5,.11,dark105,port105);box(x,2.65,z,2.6,.11,.11,wood105,port105);for(const dx of [-.8,0,.8]){const f=new THREE.Mesh(new THREE.ConeGeometry(.16,.75,6),fish105);f.rotation.z=Math.PI;f.position.set(x+dx,2.15,z);port105.add(f);}}
          rack105(-13,32.6);rack105(11,32.5);
          // cargo is intentionally placed on the dry bank
          for(const q of [[-20,32.2],[-18.6,32.1],[3.5,32.1],[5,32.2],[19,32.1]])box(q[0],1.48,q[1],1.05,.62,.9,wood105,port105);
          for(const q of [[-6,32.4],[16,32.3]]){const b=new THREE.Mesh(new THREE.CylinderGeometry(.45,.52,.72,8),cloth105);b.position.set(q[0],1.55,q[1]);port105.add(b);}
          // low mooring posts along the waterline
          for(const x of [-27,-22,-7,-2,5,21,27]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,1.15,7),dark105);p.position.set(x,.55,35.3);port105.add(p);}
          // a couple of warm shore lamps
          for(const x of [-15,13]){box(x,1.35,33,.11,2.7,.11,dark105,port105);const l=new THREE.Mesh(new THREE.SphereGeometry(.16,8,7),warm105);l.position.set(x,2.75,33);port105.add(l);lit.push(warm105);}
          '''
          if 'v10.5 waterfront activity' not in s:
              if marker not in s: raise SystemExit('residents marker missing')
              s=s.replace(marker,add+'\n'+marker,1)
          s=s.replace('Bellmire v10.4 — Orlaithe miniature','Bellmire v10.5 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v10.4','Orlaithe miniature · v10.5')
          p.write_text(s)
      - name: Commit v10.5
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v10.5 waterfront activity' || exit 0
          git push
