name: Bellmire v9.8 waterfront cleanup
on:
  push:
    paths:
      - '.github/workflows/v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Waterfront cleanup
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='// v9.7 — open waterfront: hide the oversized foreground retaining blocks that cut the town off from water'
          add=r'''
          // v9.8 waterfront cleanup
          scene.traverse(o=>{
            if(!o.isMesh || !o.geometry || !o.geometry.parameters) return;
            const g=o.geometry.parameters, p=o.position;
            const a=Math.max(g.width||0,g.depth||0), b=Math.min(g.width||0,g.depth||0);
            if(a>=18 && b<=12 && g.height>=2.0 && p.z>18 && p.y<5) o.visible=false;
          });
          '''
          if 'v9.8 waterfront cleanup' not in s:
              if marker not in s: raise SystemExit('marker missing')
              s=s.replace(marker,add+'\n'+marker,1)
          s=s.replace('Bellmire v9.7 — Orlaithe miniature','Bellmire v9.8 — Orlaithe miniature')
          s=s.replace('Orlaithe miniature · v9.7','Orlaithe miniature · v9.8')
          p.write_text(s)
      - name: Commit v9.8
        run: |
          git config user.name 'Bellmire Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v9.8 waterfront cleanup' || exit 0
          git push
