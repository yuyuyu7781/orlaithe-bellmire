<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bellmire v8.3 Preview</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1115;color:#eee;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}.panel{position:fixed;z-index:10;left:10px;top:10px;right:10px;max-width:760px;padding:11px 13px;background:#101923df;border:1px solid #ffffff22;border-radius:16px;backdrop-filter:blur(12px)}.title{font:18px Georgia,serif;letter-spacing:.12em}.sub{font-size:10px;opacity:.65;margin:3px 0 7px}.row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}button{border:1px solid #ffffff24;background:#ffffff0e;color:#eee;border-radius:999px;padding:7px 10px;font-size:11px}button.active{background:#d8c8a52b;border-color:#e5d5b8}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b1115;z-index:20;font:20px Georgia,serif;letter-spacing:.2em}.hide{display:none}@media(max-width:700px){.panel{padding:9px}.title{font-size:15px}.sub{display:none}button{padding:6px 8px;font-size:10px}}</style></head><body><div id="app"></div><div id="loading" class="loading">B E L L M I R E</div><div class="panel"><div class="title">BELLMIRE <small>v8.3 PREVIEW</small></div><div class="sub">水が街を流れ、人と猫が路地を歩き、酒場に灯りがともる丘の街</div><div class="row" id="weather"><button data-w="clear" class="active">晴れ</button><button data-w="rain">雨</button><button data-w="fog">霧</button><button data-w="blackout">停電</button><button data-w="dawn">夜明け</button><button data-w="night">夜</button></div><div class="row" id="views"><button data-v="overview" class="active">全景</button><button data-v="alley">路地</button><button data-v="tavern">酒場</button><button data-v="mill">水車</button><button data-v="canal">水路</button><button data-v="resident">住人</button><button data-v="cat">猫</button><button data-v="drone">ドローン</button></div><div class="row"><button id="fullscreen">全画面</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,400),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.querySelector('#app').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.18,.7,.8);composer.addPass(bloom);const hemi=new THREE.HemisphereLight(0xc9d4cf,0x332d28,1.3),sun=new THREE.DirectionalLight(0xffe1b5,1.8);sun.position.set(-45,65,35);sun.castShadow=true;scene.add(hemi,sun);scene.background=new THREE.Color(0x9eaaa3);scene.fog=new THREE.FogExp2(0x9eaaa3,.0018);
const M=(c,r=.86,m=.02)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}),stone=M(0x716f66),dark=M(0x4c514b),plaster=M(0xa69f8a),wood=M(0x513a2c),roof=M(0x34413a),path=M(0x8b8577),grass=M(0x566850),water=M(0x426f76,.22,.08),iron=M(0x353936,.55,.5),terr=M(0x8c6551),wine=M(0x745d58),skin=M(0xb98a68),cloth=M(0x53606a),boot=M(0x302923),catMat=M(0x3e3934);const lit=[];function box(x,y,z,w,h,d,ma=stone,p=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);o.position.set(x,y+h/2,z);o.castShadow=o.receiveShadow=true;p.add(o);return o}function roofAt(x,y,z,w,d,h=2,ma=roof){const o=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,h,4),ma);o.rotation.y=Math.PI/4;o.position.set(x,y+h/2,z);o.castShadow=true;scene.add(o);return o}function glowWindow(x,y,z,w=.65,h=.9){const ma=new THREE.MeshStandardMaterial({color:0xf2c17b,emissive:0xff9f43,emissiveIntensity:.65});const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,.1),ma);o.position.set(x,y,z);scene.add(o);lit.push(ma)}function house(x,z,y,w,d,h,k=0){box(x,y,z,w,h,d,k%4===0?plaster:k%4===1?stone:k%4===2?wine:dark);roofAt(x,y+h,z,w,d,2+(k%3)*.25);glowWindow(x-w*.22,y+h*.55,z+d/2+.06);glowWindow(x+w*.22,y+h*.55,z+d/2+.06)}
// fixed terrain: no Math.random for permanent scenery
box(0,-2,0,112,3,90,grass);box(-10,1,-3,90,2.5,62,dark);box(-18,3.45,-14,69,2.8,42,stone);box(-12,6.2,-24,51,3.1,27,dark);const houses=[[-43,31,1.1,6,5,6],[-35,31,1.1,5,5,7],[-27,30,1.1,6,5,6],[-18,29,1.1,6,5,8],[-42,22,1.1,6,5,7],[-33,23,1.1,6,5,6],[-24,22,1.1,5,5,7],[-15,22,1.1,6,5,6],[-43,13,1.1,6,5,7],[-34,14,1.1,5,5,6],[-25,13,1.1,6,5,7],[-16,14,1.1,5,5,6],[-7,13,1.1,6,5,7],[-39,-4,4.5,6,5,7],[-30,-5,4.5,6,5,8],[-21,-4,4.5,6,5,7],[-12,-5,4.5,6,5,8],[-3,-4,4.5,6,5,7],[6,-5,4.5,6,5,8],[-34,-23,8.2,6,5,8],[-25,-24,8.2,6,5,9],[-16,-23,8.2,6,5,8],[-7,-24,8.2,6,5,9],[2,-23,8.2,6,5,8],[31,31,1.1,6,5,7],[38,27,1.1,5,5,9],[34,18,1.1,6,5,7],[37,8,1.1,5,5,8],[29,-4,4.5,7,5,8],[36,-9,4.5,5,5,7],[25,-15,4.5,6,5,9],[20,-24,8.2,7,5,8]];houses.forEach((h,i)=>house(...h,i));
// fixed rocks / plants
[[-48,.5,35,1.4],[-45,.6,18,1.1],[-8,.8,36,1.5],[9,1,31,1.3],[40,.6,34,1.2],[42,.7,-17,1.4],[-40,5,-27,1.3],[-3,9,-35,1.2]].forEach(([x,y,z,r])=>{const q=new THREE.Mesh(new THREE.DodecahedronGeometry(r,0),dark);q.position.set(x,y,z);q.scale.y=.65;scene.add(q)});[[-39,1.35,27],[-30,1.35,26],[-20,1.35,31],[-11,1.35,18],[30,1.35,34],[37,1.35,20],[-28,4.8,-9],[-8,8.5,-27]].forEach(([x,y,z])=>{const pot=new THREE.Mesh(new THREE.CylinderGeometry(.35,.27,.5,9),terr);pot.position.set(x,y,z);scene.add(pot);const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.45,1),M(0x53624d));b.position.set(x,y+.55,z);scene.add(b)});
// central canal and physically legible mill system: upper leat -> drop -> wheel -> tailrace
box(20,.05,9,7,.38,72,water);box(14.8,.2,9,2.4,.5,72,path);box(25.2,.2,9,2.4,.5,72,path);[-24,-6,12,30].forEach(z=>box(20,.55,z,14,.65,2.4,path));
// upper leat approaches mill from east at higher level
box(36,3.55,28,27,.28,2.4,water);box(36,3.45,26.2,27,.5,1,path);box(36,3.45,29.8,27,.5,1,path);box(23.1,2.0,28,2.5,3.4,2.4,water); // falling sheet

box(16,1.1,28,9,8,8,stone);roofAt(16,9.1,28,9,8,2.7);box(16,1.1,32.05,3.1,3.4,.18,wood);glowWindow(13.5,5.3,32.12,.7,1);glowWindow(18.5,5.3,32.12,.7,1);
const wheel=new THREE.Group();wheel.add(new THREE.Mesh(new THREE.TorusGeometry(3.5,.3,8,32),wood));const hub=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.5,14),iron);hub.rotation.x=Math.PI/2;wheel.add(hub);for(let i=0;i<12;i++){const a=i*Math.PI/6,s=new THREE.Mesh(new THREE.BoxGeometry(.18,6.5,.22),wood);s.rotation.z=a;wheel.add(s);const p=new THREE.Mesh(new THREE.BoxGeometry(1.1,.42,.8),wood);p.position.set(Math.cos(a)*3.45,Math.sin(a)*3.45,0);p.rotation.z=a;wheel.add(p)}wheel.position.set(21.8,3.05,28);wheel.rotation.y=Math.PI/2;scene.add(wheel);box(22,.08,34,3,.32,12,water); // tailrace downstream
// tavern: The Copper Kettle, distinct from inn
box(-10,1.1,6,9,7.5,7,wine);roofAt(-10,8.6,6,9,7,2.8);box(-10,1.12,9.55,2.4,3.2,.18,wood);glowWindow(-13,5.2,9.58,1,1.25);glowWindow(-7,5.2,9.58,1,1.25);box(-15.2,4.7,9.8,.12,2.1,.12,iron);box(-14.2,5.7,9.8,1.8,.9,.14,wood);[-15.2,-13.8,-12.4].forEach(x=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(.48,.55,1.05,10),wood);b.position.set(x,1.65,10.4);scene.add(b)});const tavernLight=new THREE.PointLight(0xffa34e,1.8,16);tavernLight.position.set(-10,5.3,10);scene.add(tavernLight);

for(let i=0;i<20;i++)box(-3+Math.sin(i*.5)*1.4,1.1+i*.36,24-i*2.1,3.8,.25,1.6,path);
// residents: feet are at group y=laneY; no terrace raycast, no accumulating y offset
const walkers=[];function person(color){const g=new THREE.Group(),cm=M(color);const body=new THREE.Mesh(new THREE.CylinderGeometry(.34,.46,1.15,8),cm);body.position.y=1.35;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,10,8),skin);head.position.y=2.18;g.add(head);const legs=[],arms=[];for(const x of[-.22,.22]){const q=new THREE.Mesh(new THREE.CylinderGeometry(.085,.1,.82,7),boot);q.position.set(x,.52,0);g.add(q);legs.push(q)}for(const x of[-.43,.43]){const q=new THREE.Mesh(new THREE.CylinderGeometry(.07,.085,.85,7),cm);q.position.set(x,1.38,0);g.add(q);arms.push(q)}g.userData={legs,arms};scene.add(g);return g}function addWalker(a,b,y,c,s){const p=person(c);walkers.push({p,a:new THREE.Vector3(a[0],y,a[1]),b:new THREE.Vector3(b[0],y,b[1]),s});}addWalker([-36,27],[-25,27],1.13,0x7e4d35,.23);addWalker([-40,11],[-28,11],1.13,0x53695c,.18);addWalker([-15,-8],[4,-8],4.63,0x6c6257,.2);addWalker([8,18],[8,25],1.13,0x2d5144,.15);
// cat: dedicated open lane, smaller body, camera always tracks actual position
const cat=new THREE.Group(),body=new THREE.Mesh(new THREE.SphereGeometry(.42,12,8),catMat);body.scale.set(1.35,.7,.75);body.position.y=.58;cat.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.31,12,8),catMat);head.position.set(.53,.78,0);cat.add(head);for(const z of[-.17,.17]){const e=new THREE.Mesh(new THREE.ConeGeometry(.12,.27,4),catMat);e.position.set(.55,1.03,z);cat.add(e)}const catLegs=[];for(const z of[-.2,.2])for(const x of[-.36,.32]){const q=new THREE.Mesh(new THREE.CylinderGeometry(.06,.07,.48,7),catMat);q.position.set(x,.25,z);cat.add(q);catLegs.push(q)}const tail=new THREE.Mesh(new THREE.TorusGeometry(.48,.065,7,18,Math.PI*1.4),catMat);tail.rotation.y=Math.PI/2;tail.position.set(-.65,.75,0);cat.add(tail);cat.scale.setScalar(1.15);scene.add(cat);const catPath=[new THREE.Vector3(-38,1.12,34),new THREE.Vector3(-32,1.12,34),new THREE.Vector3(-27,1.12,32),new THREE.Vector3(-24,1.12,29)];function pathPos(points,u,out){const n=points.length-1,q=Math.min(n-.0001,u*n),i=Math.floor(q),f=q-i;out.lerpVectors(points[i],points[i+1],f);return points[Math.min(i+1,n)]}const cp=new THREE.Vector3();
// rain only is random; permanent scenery is deterministic
const N=1000,ra=new Float32Array(N*3);for(let i=0;i<N;i++){ra[i*3]=(Math.random()-.5)*120;ra[i*3+1]=Math.random()*65;ra[i*3+2]=(Math.random()-.5)*95}const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(ra,3));const rain=new THREE.Points(rg,new THREE.PointsMaterial({color:0xc5d7de,size:.11,transparent:true,opacity:.6}));rain.visible=false;scene.add(rain);
const views={overview:[[72,54,78],[-2,7,0]],alley:[[-32,5,37],[-22,3,27]],tavern:[[-20,7,18],[-10,4,6]],mill:[[34,11,40],[20,4,28]],canal:[[31,8,34],[20,2,12]],resident:[[-34,4.5,33],[-29,2.5,27]],cat:[[-35,3.4,39],[-32,1.8,34]],drone:[[0,34,48],[-6,6,-4]]};let view='overview';function setView(v){view=v;const[p,t]=views[v];camera.position.fromArray(p);controls.target.fromArray(t);controls.enabled=v!=='drone';document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}function weather(w){rain.visible=w==='rain';lit.forEach(m=>m.emissiveIntensity=w==='blackout'?0:.65);tavernLight.intensity=w==='blackout'?0:1.8;const c={clear:[0x9eaaa3,.0018,1.35,1.85,1.02,.18],rain:[0x5d6b70,.009,.7,.38,.78,.28],fog:[0x929b96,.012,.86,.48,.8,.32],blackout:[0x071017,.01,.12,.02,.48,.15],dawn:[0x5f6c7d,.007,.5,.45,.7,.28],night:[0x07111d,.008,.25,.05,.58,.48]}[w];scene.background.set(c[0]);scene.fog.color.set(c[0]);scene.fog.density=c[1];hemi.intensity=c[2];sun.intensity=c[3];renderer.toneMappingExposure=c[4];bloom.strength=c[5];document.querySelectorAll('#weather button').forEach(b=>b.classList.toggle('active',b.dataset.w===w))}views;document.querySelector('#views').onclick=e=>e.target.dataset.v&&setView(e.target.dataset.v);document.querySelector('#weather').onclick=e=>e.target.dataset.w&&weather(e.target.dataset.w);fullscreen.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();wheel.rotation.z=-t*.32;walkers.forEach((r,i)=>{const ph=t*r.s+i,u=(Math.sin(ph)+1)/2,fwd=Math.cos(ph)>=0;r.p.position.lerpVectors(r.a,r.b,u);r.p.lookAt(fwd?r.b:r.a);const sw=Math.sin(t*5+i)*.45;r.p.userData.legs[0].rotation.x=sw;r.p.userData.legs[1].rotation.x=-sw;r.p.userData.arms[0].rotation.x=-sw*.7;r.p.userData.arms[1].rotation.x=sw*.7});const raw=(Math.sin(t*.16)+1)/2,u=raw<.08?0:raw>.92?1:(raw-.08)/.84,target=pathPos(catPath,u,cp);cat.position.copy(cp);cat.lookAt(target.x,cat.position.y,target.z);const cs=Math.sin(t*7)*.45;catLegs[0].rotation.z=cs;catLegs[1].rotation.z=-cs;catLegs[2].rotation.z=-cs;catLegs[3].rotation.z=cs;tail.rotation.z=.12+Math.sin(t*2)*.18;if(view==='cat'){const d=new THREE.Vector3();cat.getWorldDirection(d);camera.position.lerp(cat.position.clone().add(new THREE.Vector3(0,2.2,0)).add(d.multiplyScalar(-4.2)),.08);controls.target.lerp(cat.position.clone().add(new THREE.Vector3(0,.8,0)),.1)}if(view==='resident'){const p=walkers[0].p,d=new THREE.Vector3();p.getWorldDirection(d);camera.position.lerp(p.position.clone().add(new THREE.Vector3(0,2.8,0)).add(d.multiplyScalar(-4.5)),.07);controls.target.lerp(p.position.clone().add(new THREE.Vector3(0,1.2,0)),.1)}if(view==='drone'){camera.position.set(Math.sin(t*.07)*52,29+Math.sin(t*.11)*4,Math.cos(t*.07)*52);camera.lookAt(-6,6,-4)}if(rain.visible){const p=rg.attributes.position.array;for(let i=0;i<N;i++){p[i*3+1]-=.48;if(p[i*3+1]<0)p[i*3+1]=65}rg.attributes.position.needsUpdate=true}controls.update();composer.render()}setView('overview');weather('clear');animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});loading.classList.add('hide');</script></body></html>
